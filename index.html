<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6b4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Outils AVEC">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Outils de gestion des groupements AVEC</title>
<style>
:root{--g:#1f6b4a;--g2:#e6f2ec;--o:#d9822b;--o2:#fbefe2;--r:#b3261e;--r2:#fbe7e5;--t:#1d2421;--m:#5d6a64;--b:#dde4e0;--bg:#f6f8f7;--w:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--t);font-size:16px;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:15px;font-weight:700;flex:1;line-height:1.25}
#menuBtn{font-size:18px;padding:4px 10px}
.qrbox{text-align:center;padding:10px 0}.qrbox svg{max-width:80vw;height:auto;border:8px solid #fff;border-radius:8px}
.url{word-break:break-all;font-size:13px;background:var(--g2);padding:8px;border-radius:8px;color:var(--g)}
.menuitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--b);border-radius:10px;padding:12px;font-size:15px;margin-bottom:8px;cursor:pointer;color:var(--t)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.filters select{padding:7px;font-size:13px}
table.small td,table.small th{font-size:12px;padding:6px 3px}
#langSel{width:auto;padding:5px 6px;font-size:13px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:#fff}
#langSel option{color:#1d2421}
header .row{display:flex;gap:8px;align-items:center;margin-top:8px}
header .row select{flex:1;padding:8px;border-radius:8px;border:0;font-size:15px;background:#fff;color:var(--t)}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px;white-space:nowrap}
#status{font-size:12px;opacity:.85;margin-top:4px}
main{padding:14px;max-width:720px;margin:0 auto}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:10px}
.kpi .l{font-size:12px;color:var(--m)}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.kpi.main{grid-column:1/3;background:var(--g);color:#fff;border:0}
.kpi.main .l{color:#d6eadf}.kpi.main .v{font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;color:var(--m);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:16px;background:#fff;color:var(--t)}
textarea{min-height:120px;font-family:inherit;font-size:14px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--g2);color:var(--g)}
.btn.o{background:var(--o)}
.btn.d{background:var(--r2);color:var(--r)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;margin-top:10px}
.x{background:none;border:0;color:var(--m);font-size:18px;padding:2px 6px;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.tag.ok{background:var(--g2);color:var(--g)}.tag.late{background:var(--r2);color:var(--r)}.tag.run{background:var(--o2);color:#8a4c0f}
.muted{color:var(--m);font-size:13px}
.empty{text-align:center;color:var(--m);padding:22px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alert{background:var(--r2);color:var(--r);border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.meet td input{padding:7px;font-size:15px}
.hidden{display:none}
ol{margin:6px 0 0;padding-left:20px}
.seg{display:flex;gap:6px;margin:4px 0 12px}.seg button{flex:1;padding:9px 6px;border:1px solid var(--b);background:#fff;border-radius:10px;font-size:14px;color:var(--m);cursor:pointer}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--b);font-size:15px}.chk input{width:20px;height:20px;flex:none}
textarea.big{min-height:380px;font-size:14px;line-height:1.45}
#foot{text-align:center;font-size:11px;color:var(--m);padding:6px 0 16px}
.sub{display:block;font-size:12px;color:var(--m)}
</style>
</head>
<body>
<header>
  <div class="top">
    <button id="menuBtn" aria-label="Menu">☰</button>
    <h1 id="appTitle">Outils de gestion des groupements AVEC</h1>
    <select id="langSel" aria-label="Langue">
      <option value="fr">Français</option>
      <option value="bm">Bamanankan</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="row">
    <select id="groupSel" aria-label="Groupe"></select>
    <button id="newGroupBtn">+</button>
  </div>
  <div id="status"></div>
</header>
<main id="view"></main>
<div id="foot"></div>
<nav id="nav">
  <button data-v="home" class="on"><span class="i">🏠</span><span data-t="navHome"></span></button>
  <button data-v="members"><span class="i">👥</span><span data-t="navMembers"></span></button>
  <button data-v="meeting"><span class="i">💰</span><span data-t="navMeeting"></span></button>
  <button data-v="loans"><span class="i">🤝</span><span data-t="navLoans"></span></button>
  <button data-v="docs"><span class="i">📄</span><span data-t="navDocs"></span></button>
  <button data-v="report"><span class="i">📋</span><span data-t="navReport"></span></button>
</nav>

nas. Les 3 clés sont gardées par 3 membres différents, qui ne font pas partie du Comité de gestion. La caisse n'est ouverte qu'en réunion, devant tous les membres.\n\nArticle 11 – Cycle et partage\nLe cycle dure ______ mois. À la fin du cycle, l'épargne et les gains (intérêts, amendes) sont partagés entre les membres en proportion du nombre de parts achetées par chacun.\n\nArticle 12 – Départ et exclusion\nUn membre qui quitte le groupe ou qui est exclu récupère son épargne, moins ses dettes envers le groupe. Tout membre qui ne respecte pas gravement le règlement peut être exclu par décision de l'Assemblée.\n\nArticle 13 – Modification\nLe présent règlement peut être modifié par l'Assemblée générale à la majorité des deux tiers (2/3) des membres.\n\nFait à {lieu}, le {date}\n\nSignatures :\nPrésident(e) : ____________\nSecrétaire : ____________\nTrésorier(ère) : ____________"

 rulesTpl:"TƆN SARIYASƐBƐN\n« {nom} »\n\nSariya 1 – Tɔgɔ ni sigiyɔrɔ\nTɔndenw ye Wari Maracɛ ni Juru Tɔn (AVEC) dabɔ, a tɔgɔ ye « {nom} ». A sigiyɔrɔ ye {lieu} ye.\n\nSariya 2 – Laɲiniw\nTɔn in b'a to tɔndenw ka wari mara tuma bɛɛ, ka juru fitininw sɔrɔ, ka ɲɔgɔn dɛmɛ gɛlɛya waati la dɛmɛ kɛsu fɛ.\n\nSariya 3 – Donni tɔn na\nMɔgɔ o mɔgɔ ye san 18 sɔrɔ, ni a sigilen bɛ dugu in kɔnɔ, ni a sɔnna nin sariyaw ma, o bɛ se ka don tɔn na. Donni bɛ kɛ sikili daminɛ na. Tɔn tɛ se ka tɛmɛ tɔnden 30 kan.\n\nSariya 4 – Ɲɛmɔgɔw\nTɔndenw bɛɛ ka Ɲɔgɔnye ba de bɛ latigɛ kunbabaw ta. Ɲɛnabɔ jɛkulu bɛ kɛ ni Ɲɛmɔgɔ ye, Sɛbɛnnikɛla, Wari marabaga ani Wari jatebaga fila. U bɛ sugandi sikili kelen kama.\n\nSariya 5 – Ɲɔgɔnyew\nTɔn bɛ ɲɔgɔn ye ______ (don) o don, ______ (waati). Bɛɛ ka kan ka na.\nNi mɔgɔ nana kɔ fɛ : ______ F. Ni mɔgɔ ma na sababu tɛ : ______ F.\n\nSariya 6 – Wari marali\nNiyɔrɔ kelen sɔngɔ ye {part} ye. Tɔnden kelen kelen bɛ a ka niyɔrɔ hakɛ sugandi a donni waati la ; o hakɛ bɛ to a cogo la ɲɔgɔnye bɛɛ la fo sikili ka ban.\n\nSariya 7 – Dɛmɛ kɛsu\nTɔnden kelen kelen bɛ {social} don dɛmɛ kɛsu kɔnɔ ɲɔgɔnye o ɲɔgɔnye. A bɛ tɔndenw dɛmɛ bana, saya walima gɛlɛya wɛrɛ waati la. O dɛmɛ tɛ sara kokura. Ɲɔgɔnye ba de bɛ dɛmɛ hakɛ latigɛ.\n\nSariya 8 – Juru\nTɔnden bɛ se ka juru ta fo a ka maralen siɲɛ 3. Juru tɔnɔ ye {taux} % ye kalo o kalo. Juru waati janya laban ye kalo 3 ye. Juru bɛɛ ka kan ka sara sani sikili ka ban.\n\nSariya 9 – Juru sarali mɛnni\nNi juru sarali mɛnna, tɔnden bɛ ______ F sara, Ɲɛnabɔ jɛkulu b'a dɛmɛ ka fɛɛrɛ sɔrɔ. Juru kura tɛ di ni kɔrɔ ma sara fɔlɔ.\n\nSariya 10 – Kɛsu lakanani\nKɛsu bɛ datugu ni kadenasi 3 ye. Kile 3 bɛ tɔnden 3 bolo, minnu tɛ Ɲɛnabɔ jɛkulu la. Kɛsu tɛ da wuli fo ɲɔgɔnye la, tɔndenw bɛɛ ɲɛ kɔrɔ.\n\nSariya 11 – Sikili ni tilali\nSikili bɛ kalo ______ kɛ. Sikili laban na, maralen ni tɔnɔw (juru tɔnɔ, hakɛw) bɛ tila tɔndenw cɛ ka kɛɲɛ ni u kelen kelen ka niyɔrɔ sannenw ye.\n\nSariya 12 – Bɔli ni gɛnni\nTɔnden min bɔra tɔn na walima min gɛnna, o bɛ a ka maralen sɔrɔ, a ka juru bɔlen a la. Tɔnden min ma sariyaw bonya kosɛbɛ, Ɲɔgɔnye ba bɛ se k'a gɛn.\n\nSariya 13 – Sariyaw yɛlɛmani\nƝɔgɔnye ba bɛ se ka nin sariyaw yɛlɛma ni tɔndenw tilayɔrɔ saba la fila (2/3) sɔnna.\n\nA kɛra {lieu}, {date}\n\nBolonɔw :\nƝɛmɔgɔ : ____________\nSɛbɛnnikɛla : ____________\nWari marabaga : ____________"

 rulesTpl:"BY-LAWS\n“{nom}”\n\nArticle 1 – Name and seat\nThe members hereby create a Village Savings and Loan Association (VSLA) named “{nom}”, based in {lieu}.\n\nArticle 2 – Objectives\nThe group enables its members to save regularly, obtain small loans and support each other in hard times through the social fund.\n\nArticle 3 – Membership\nAny volunteer aged 18 or over, living in the area and accepting these by-laws may become a member. New members join at the start of a cycle. The group has a maximum of 30 members.\n\nArticle 4 – Governing bodies\nThe General Assembly (all members) takes the main decisions. The Management Committee consists of a Chairperson, a Secretary, a Treasurer and two Money Counters, elected for one cycle.\n\nArticle 5 – Meetings\nThe group meets every ______ (day) at ______ (time). Attendance is compulsory.\nLateness: fine of ______ F. Unexcused absence: fine of ______ F.\n\nArticle 6 – Savings\nThe value of one share is {part}. Each member chooses their number of shares when joining; this number stays the same at every meeting until the end of the cycle.\n\nArticle 7 – Social fund\nEach member pays {social} per meeting into the social fund. It helps members in case of illness, death or other serious events. This help is not repaid. The amount of each grant is decided by the Assembly.\n\nArticle 8 – Loans\nA member may borrow up to 3 times their savings. Interest is {taux}% per month. The maximum loan period is 3 months. All loans must be repaid before the end of the cycle.\n\nArticle 9 – Late repayment\nIn case of late repayment, the member pays a penalty of ______ F and the Committee helps find a solution. No new loan is granted until the previous one is repaid.\n\nArticle 10 – Cash box security\nThe cash box is locked with 3 padlocks. The 3 keys are kept by 3 different members who are not on the Management Committee. The box is only opened during meetings, in front of all members.\n\nArticle 11 – Cycle and share-out\nThe cycle lasts ______ months. At the end of the cycle, savings and earnings (interest, fines) are shared among members in proportion to the number of shares each has bought.\n\nArticle 12 – Leaving and exclusion\nA member who leaves or is excluded gets back their savings minus any debts to the group. A member who seriously breaks these by-laws may be excluded by decision of the Assembly.\n\nArticle 13 – Amendments\nThese by-laws may be amended by the General Assembly with a two-thirds (2/3) majority of members.\n\nDone at {lieu}, on {date}\n\nSignatures:\nChairperson: ____________\nSecretary: ____________\nTreasurer: ____________"
}};

/* ---------- code QR ---------- */
/* Générateur de code QR minimal (mode octet, correction M, versions 1 à 6). */
function makeQR(text){
  var bytes=[],s=unescape(encodeURIComponent(text));
  for(var i=0;i<s.length;i++)bytes.push(s.charCodeAt(i));
  var ECC=[10,16,26,18,24,16],NB=[1,1,1,2,2,4],RAW=[26,44,70,100,134,172],AL=[[],[6,18],[6,22],[6,26],[6,30],[6,34]];
  var ver=0;
  for(var v=1;v<=6;v++){var cap=RAW[v-1]-ECC[v-1]*NB[v-1];if(4+8+8*bytes.length<=cap*8){ver=v;break}}
  if(!ver)return null;
  var size=17+4*ver,ecc=ECC[ver-1],nb=NB[ver-1],raw=RAW[ver-1],dcw=raw-ecc*nb;
  // bits
  var bb=[];function put(val,len){for(var i=len-1;i>=0;i--)bb.push((val>>>i)&1)}
  put(4,4);put(bytes.length,8);bytes.forEach(function(b){put(b,8)});
  put(0,Math.min(4,dcw*8-bb.length));while(bb.length%8)bb.push(0);
  var data=[];for(i=0;i<bb.length;i+=8){var x=0;for(var j=0;j<8;j++)x=(x<<1)|bb[i+j];data.push(x)}
  for(var pad=0xEC;data.length<dcw;pad^=0xEC^0x11)data.push(pad);
  // GF(256)
  var EXP=new Array(512),LOG=new Array(256),xv=1;
  for(i=0;i<255;i++){EXP[i]=xv;LOG[xv]=i;xv<<=1;if(xv&0x100)xv^=0x11d}
  for(i=255;i<512;i++)EXP[i]=EXP[i-255];
  function mul(a,b){return a&&b?EXP[LOG[a]+LOG[b]]:0}
  var gen=[1];for(i=0;i<ecc;i++){var nx=new Array(gen.length+1).fill(0);for(j=0;j<gen.length;j++){nx[j]^=gen[j];nx[j+1]^=mul(gen[j],EXP[i])}gen=nx}
  function rs(block){var r=block.concat(new Array(ecc).fill(0));for(var i=0;i<block.length;i++){var c=r[i];if(c)for(var j=0;j<gen.length;j++)r[i+j]^=mul(gen[j],c)}return r.slice(block.length)}
  var shortLen=Math.floor(raw/nb)-ecc,nShort=nb-raw%nb,blocks=[],ecs=[],k=0;
  for(i=0;i<nb;i++){var len=shortLen+(i<nShort?0:1);var b=data.slice(k,k+len);k+=len;blocks.push(b);ecs.push(rs(b))}
  var cw=[];for(i=0;i<=shortLen;i++)for(j=0;j<nb;j++)if(i<blocks[j].length)cw.push(blocks[j][i]);
  for(i=0;i<ecc;i++)for(j=0;j<nb;j++)cw.push(ecs[j][i]);
  // matrice
  var M=[],F=[];for(i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
  function setF(x,y,d){M[y][x]=d;F[y][x]=true}
  for(i=0;i<size;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
  function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var d=Math.max(Math.abs(dx),Math.abs(dy)),xx=cx+dx,yy=cy+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)setF(xx,yy,d!==2&&d!==4)}}
  finder(3,3);finder(size-4,3);finder(3,size-4);
  var al=AL[ver-1],na=al.length;
  for(i=0;i<na;i++)for(j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)setF(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
  function format(mask){
    var d=(0<<3)|mask,rem=d;for(var i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);
    var bits=((d<<10)|rem)^0x5412;function g(i){return ((bits>>>i)&1)!==0}
    for(i=0;i<=5;i++)setF(8,i,g(i));setF(8,7,g(6));setF(8,8,g(7));setF(7,8,g(8));
    for(i=9;i<15;i++)setF(14-i,8,g(i));
    for(i=0;i<8;i++)setF(size-1-i,8,g(i));
    for(i=8;i<15;i++)setF(8,size-15+i,g(i));
    setF(8,size-8,true);
  }
  format(0);
  var bi=0;
  for(var right=size-1;right>=1;right-=2){if(right===6)right=5;
    for(var vert=0;vert<size;vert++)for(j=0;j<2;j++){var x2=right-j,up=((right+1)&2)===0,y2=up?size-1-vert:vert;
      if(!F[y2][x2]&&bi<cw.length*8){M[y2][x2]=((cw[bi>>>3]>>>(7-(bi&7)))&1)!==0;bi++}}}
  function maskFn(m,x,y){switch(m){case 0:return (x+y)%2===0;case 1:return y%2===0;case 2:return x%3===0;case 3:return (x+y)%3===0;case 4:return (Math.floor(x/3)+Math.floor(y/2))%2===0;case 5:return x*y%2+x*y%3===0;case 6:return (x*y%2+x*y%3)%2===0;default:return ((x+y)%2+x*y%3)%2===0}}
  function applyMask(m){for(var y=0;y<size;y++)for(var x=0;x<size;x++)if(!F[y][x]&&maskFn(m,x,y))M[y][x]=!M[y][x]}
  function penalty(){
    var p=0,y,x,run,dark=0;
    for(var pass=0;pass<2;pass++)for(y=0;y<size;y++){run=1;for(x=1;x<=size;x++){var a=pass?M[x-1]&&M[x-1][y]:M[y][x-1],b=x<size?(pass?M[x][y]:M[y][x]):null;if(x<size&&a===b)run++;else{if(run>=5)p+=3+run-5;run=1}}}
    for(y=0;y<size-1;y++)for(x=0;x<size-1;x++){var c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
    var pat=[true,false,true,true,true,false,true,false,false,false,false],pat2=pat.slice().reverse();
    function match(get){for(var i=0;i<11;i++)if(get(i)!==pat[i])return false;return true}
    function match2(get){for(var i=0;i<11;i++)if(get(i)!==pat2[i])return false;return true}
    for(y=0;y<size;y++)for(x=0;x+11<=size;x++){(function(y,x){if(match(function(i){return M[y][x+i]})||match2(function(i){return M[y][x+i]}))p+=40;if(match(function(i){return M[x+i][y]})||match2(function(i){return M[x+i][y]}))p+=40})(y,x)}
    for(y=0;y<size;y++)for(x=0;x<size;x++)if(M[y][x])dark++;
    p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
    return p;
  }
  var best=0,bestP=1e9;
  for(var m=0;m<8;m++){applyMask(m);format(m);var pp=penalty();if(pp<bestP){bestP=pp;best=m}applyMask(m)}
  applyMask(best);format(best);
  return M;
}
function qrSVG(text,px){
  var M=makeQR(text);if(!M)return "";
  var n=M.length,q=4,s=n+q*2,d="";
  for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(M[y][x])d+="M"+(x+q)+" "+(y+q)+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+s+' '+s+'" width="'+(px||240)+'" height="'+(px||240)+'" shape-rendering="crispEdges"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}


/* ---------- utilitaires ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function f(n){return Math.round(n).toLocaleString("fr-FR")+" F"}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function addMonths(s,m){var d=new Date(s+"T12:00:00");d.setMonth(d.getMonth()+Math.round(m));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sum(a,fn){return a.reduce(function(s,x){return s+fn(x)},0)}
function $(id){return document.getElementById(id)}
function toast(msg){document.querySelectorAll(".toast").forEach(function(x){x.remove()});var el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},2200)}
function g(){return groups[currentId]||null}
function mName(gr,id){var m=gr.membres.find(function(x){return x.id===id});return m?m.nom:t("deleted")}
function normalize(x){x.membres=x.membres||[];x.cotisations=x.cotisations||[];x.prets=x.prets||[];x.remboursements=x.remboursements||[];x.pvs=x.pvs||[];x.reglement=x.reglement||"";if(x.village==null)x.village=x.lieu||"";x.lieu=x.village;x.membres.forEach(function(m){if(!m.parts)m.parts=1});x.part=num(x.part);x.taux=num(x.taux);x.social=num(x.social);return x}
function place(gr){return [gr.village,gr.commune,gr.cercle,gr.region].filter(function(x){return x}).join(", ")}
function active(gr){return gr.membres.filter(function(m){return !m.sorti})}
function hasOps(gr,id){return gr.cotisations.some(function(c){return c.membreId===id})||gr.prets.some(function(p){return p.membreId===id})}

/* ---------- stockage ---------- */
function setStatus(k){statusKey=k;$("status").textContent=t(k)}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({groups:groups,currentId:currentId}))}catch(e){}}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(s&&s.groups){groups=s.groups;currentId=s.currentId;Object.keys(groups).forEach(function(k){normalize(groups[k])})}}catch(e){}}
function persist(gr){
  if(mode==="cloud"&&col){
    var id=gr.id,body=JSON.parse(JSON.stringify(gr));lastJson[id]=JSON.stringify(body);
    var prev=writeChains[id]||Promise.resolve();
    writeChains[id]=prev.then(function(){return col.doc(id).set(body)}).then(function(){setStatus("saved")},function(e){setStatus("saveFail");if(e&&e.code==="quota_exceeded")toast(t("full"))});
  }
  saveLocal();
}
function removeGroup(id){
  delete groups[id];
  if(mode==="cloud"&&col){var prev=writeChains[id]||Promise.resolve();writeChains[id]=prev.then(function(){return col.doc(id).delete()}).catch(function(){})}
  saveLocal();
}
function fallback(){mode="local";setStatus("offline")}
function startCloud(){
  if(!window.claude||typeof window.claude.use!=="function"){fallback();return}
  setStatus("connecting");
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user){fallback();return}
    return user.id().then(function(id){
      if(!id){fallback();return}
      col=db.collection("data/users/"+id);
      var timer=setTimeout(function(){setStatus("slow")},10000),first=true;
      col.onSnapshot(function(snap){
        if(!snap.metadata.fromCache)clearTimeout(timer);
        var remote={};
        snap.docs.forEach(function(d){if(d.exists){var b=d.data();if(b&&b.id)remote[b.id]=normalize(JSON.parse(JSON.stringify(b)))}});
        if(first){first=false;mode="cloud";Object.keys(groups).forEach(function(k){if(!remote[k]){remote[k]=groups[k];persist(groups[k])}})}
        var changed=false;
        Object.keys(remote).forEach(function(k){var j=JSON.stringify(remote[k]);if(lastJson[k]!==j){lastJson[k]=j;groups[k]=remote[k];changed=true}});
        if(!snap.metadata.fromCache){Object.keys(groups).forEach(function(k){if(!remote[k]&&!writeChains[k]){delete groups[k];changed=true}});setStatus("synced")}
        saveLocal();if(changed)render();
      },function(){clearTimeout(timer);mode="local";setStatus("offline")});
    });
  }).catch(fallback);
}

/* ---------- calculs ---------- */
function loanInfo(gr,p){
  var du=p.montant*(1+(p.taux/100)*p.duree);
  var paye=sum(gr.remboursements.filter(function(r){return r.pretId===p.id}),function(r){return r.montant});
  var reste=Math.max(0,du-paye),ech=addMonths(p.date,p.duree);
  return {du:du,paye:paye,reste:reste,ech:ech,st:reste<=0.5?"ok":(ech<today()?"late":"run")};
}
function stats(gr){
  var ep=sum(gr.cotisations,function(c){return c.epargne}),so=sum(gr.cotisations,function(c){return c.social});
  var pr=sum(gr.prets,function(p){return p.montant}),rb=sum(gr.remboursements,function(r){return r.montant});
  var enc=0,late=[],interets=0;
  gr.prets.forEach(function(p){var i=loanInfo(gr,p);enc+=i.reste;interets+=i.du-p.montant;if(i.st==="late")late.push({p:p,i:i})});
  return {ep:ep,so:so,caisse:ep+so+rb-pr,enc:enc,late:late,interets:interets};
}
function memberStats(gr,m){
  var ep=sum(gr.cotisations.filter(function(c){return c.membreId===m.id}),function(c){return c.epargne}),reste=0;
  gr.prets.filter(function(p){return p.membreId===m.id}).forEach(function(p){reste+=loanInfo(gr,p).reste});
  return {ep:ep,reste:reste};
}

  $("supFile").onclick=function(){var pk=exportPacket();shareFileOrCopy(JSON.stringify(pk),"groupements-"+((profile.nom||"animateur").replace(/[^\w\-]+/g,"_"))+"-"+today()+".json","application/json",t("dataCopied"))};
  $("supCopy").onclick=function(){copyText(JSON.stringify(exportPacket()),t("dataCopied"))};
  $("bk").onclick=function(){copyText(JSON.stringify({app:"caisse-avec",groups:groups}),t("bkCopied"))};
  $("rsOk").onclick=function(){
    var data;try{data=JSON.parse($("rs").value)}catch(e){toast(t("invalid"));return}
    if(!data||!data.groups){toast(t("invalid"));return}
    var n=0,firstId=null;Object.keys(data.groups).forEach(function(k){var x=normalize(data.groups[k]);if(x&&x.id&&x.nom){groups[x.id]=x;persist(x);n++;firstId=firstId||x.id}});
    if(n){currentId=firstId;render();toast(t("restored",{n:n}))}else toast(t("invalid"));
  };
}
function exportPacket(){
  var list=[];Object.keys(groups).forEach(function(k){list.push(groups[k])});
  return {app:"outils-avec",type:"export",date:today(),from:{nom:profile.nom||"",tel:profile.tel||"",structure:profile.structure||""},groups:list};
}
function shareFileOrCopy(text,fname,mime,copiedMsg){
  try{
    var file=new File([text],fname,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:fname}).catch(function(){});return}
  }catch(e){}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=fname;document.body.appendChild(a);a.click();a.remove();toast(t("csvDone"))}catch(e){}
  copyText(text,copiedMsg);
}
function appUrl(){return /^https?:$/.test(location.protocol)&&/github\.io$/.test(location.hostname)?location.origin+location.pathname.replace(/index\.html$/,""):APP_URL}
function openMenu(){
  modal('<h3>'+esc(t("menu"))+'</h3>'+
    '<button class="menuitem" data-go="share">📲 '+esc(t("shareApp"))+'</button>'+
    '<button class="menuitem" data-go="global">🌍 '+esc(t("global"))+'</button>'+
    '<button class="menuitem" data-go="profile">👤 '+esc(t("profile"))+'</button>'+
    '<div class="actions"><button class="btn sec" id="mClose">'+esc(t("close"))+'</button></div>',function(m,close){
    $("mClose").onclick=close;
    m.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){var v=b.getAttribute("data-go");close();if(v==="profile"){profileForm();return}view=v;render();window.scrollTo(0,0)}});
  });
}
function profileForm(){
  modal('<h3>'+esc(t("profile"))+'</h3><p class="muted">'+esc(t("profileHint"))+'</p>'+
    '<label>'+esc(t("name"))+'</label><input id="pNom" value="'+esc(profile.nom||"")+'">'+
    '<label>'+esc(t("phone"))+'</label><input id="pTel" inputmode="tel" value="'+esc(profile.tel||"")+'">'+
    '<label>'+esc(t("structure"))+'</label><input id="pStr" value="'+esc(profile.structure||"")+'">'+
    '<div class="actions"><button class="btn sec" id="pNo">'+esc(t("cancel"))+'</button><button class="btn" id="pOk">'+esc(t("save"))+'</button></div>',function(m,close){
    $("pNo").onclick=close;$("pOk").onclick=function(){profile={nom:$("pNom").value.trim(),tel:$("pTel").value.trim(),structure:$("pStr").value.trim()};saveProfile();close();toast(t("profileSaved"))};
  });
}
function vShare(){
  var u=appUrl();
  $("view").innerHTML='<h2>📲 '+esc(t("shareApp"))+'</h2><div class="card"><div class="qrbox">'+qrSVG(u,260)+'</div><p class="url">'+esc(u)+'</p><p class="muted">'+esc(t("shareHint"))+'</p>'+
    '<button class="btn full" id="shL">'+esc(t("shareBtn"))+'</button><button class="btn sec full" id="cpL">'+esc(t("copyLink"))+'</button></div>'+
    '<div class="card muted">ℹ️ '+esc(t("xenderNote"))+'</div>';
  $("cpL").onclick=function(){copyText(u,t("linkCopied"))};
  $("shL").onclick=function(){try{if(navigator.share){navigator.share({title:t("appTitle"),text:t("appTitle"),url:u}).catch(function(){});return}}catch(e){}copyText(u,t("linkCopied"))};
}
var gFilter={region:"",cercle:"",commune:""};
function allGlobal(){
  var rows=[];
  Object.keys(groups).forEach(function(k){rows.push({g:groups[k],src:t("mine"),recu:"",mine:true})});
  Object.keys(globalDb).forEach(function(k){if(groups[k])return;var e=globalDb[k];rows.push({g:normalize(e.g),src:(e.from&&e.from.nom)||e.g.animateur||"?",recu:e.recu,mine:false})});
  return rows;
}
function importPacket(text){
  var data;try{data=JSON.parse(text)}catch(e){toast(t("invalid"));return 0}
  var list=[];if(data&&Array.isArray(data.groups))list=data.groups;else if(data&&data.groups&&typeof data.groups==="object")list=Object.keys(data.groups).map(function(k){return data.groups[k]});
  var n=0;list.forEach(function(x){if(x&&x.id&&x.nom){globalDb[x.id]={g:normalize(x),from:data.from||{},recu:today()};n++}});
  if(n){saveGlobal();toast(t("imported",{n:n}))}else toast(t("invalid"));
  return n;
}
function vGlobal(){
  var rows=allGlobal();
  function uniq(key,filter){var o={};rows.forEach(function(r){if(filter(r)&&r.g[key])o[r.g[key]]=1});return Object.keys(o).sort()}
  function sel(id,key,list){return '<select id="'+id+'"><option value="">'+esc(t(key))+' : '+esc(t("filterAll"))+'</option>'+list.map(function(v){return '<option'+(gFilter[key]===v?' selected':'')+'>'+esc(v)+'</option>'}).join("")+'</select>'}
  var regs=uniq("region",function(){return true});
  var cers=uniq("cercle",function(r){return !gFilter.region||r.g.region===gFilter.region});
  var coms=uniq("commune",function(r){return (!gFilter.region||r.g.region===gFilter.region)&&(!gFilter.cercle||r.g.cercle===gFilter.cercle)});
  var vis=rows.filter(function(r){return (!gFilter.region||r.g.region===gFilter.region)&&(!gFilter.cercle||r.g.cercle===gFilter.cercle)&&(!gFilter.commune||r.g.commune===gFilter.commune)});
  var T={m:0,ep:0,so:0,enc:0,late:0,caisse:0};
  vis.forEach(function(r){var s=stats(r.g);r.s=s;r.m=active(r.g).length;T.m+=r.m;T.ep+=s.ep;T.so+=s.so;T.enc+=s.enc;T.late+=s.late.length;T.caisse+=s.caisse});
  var h='<h2>🌍 '+esc(t("globalT"))+'</h2><div class="card"><p class="muted">'+esc(t("globalHint"))+'</p>'+
    '<label>'+esc(t("importFile"))+'</label><input type="file" id="gFile" accept=".json,.txt,application/json,text/plain">'+
    '<label>'+esc(t("importPaste"))+'</label><textarea id="gPaste" style="min-height:70px"></textarea><button class="btn full" id="gImp">'+esc(t("importBtn"))+'</button></div>'+
    '<div class="filters">'+sel("fR","region",regs)+sel("fC","cercle",cers)+sel("fM","commune",coms)+'</div>'+
    '<div class="kpis" style="margin-top:8px"><div class="kpi main"><div class="l">'+esc(t("cash"))+'</div><div class="v">'+f(T.caisse)+'</div></div>'+
    '<div class="kpi"><div class="l">'+esc(t("nbGroups"))+'</div><div class="v">'+vis.length+'</div></div>'+
    '<div class="kpi"><div class="l">'+esc(t("nbMembers"))+'</div><div class="v">'+T.m+'</div></div>'+
    '<div class="kpi"><div class="l">'+esc(t("savings"))+'</div><div class="v">'+f(T.ep)+'</div></div>'+
    '<div class="kpi"><div class="l">'+esc(t("social"))+'</div><div class="v">'+f(T.so)+'</div></div>'+
    '<div class="kpi"><div class="l">'+esc(t("toRecover"))+'</div><div class="v">'+f(T.enc)+'</div></div>'+
    '<div class="kpi"><div class="l">'+esc(t("lateCount"))+'</div><div class="v">'+T.late+'</div></div></div>';
  if(!vis.length)h+='<div class="card empty">'+esc(t("globalEmpty"))+'</div>';
  else{
    h+='<div class="card" style="overflow-x:auto"><table class="small"><tr><th>'+esc(t("colGroup"))+'</th><th>'+esc(t("colAnim"))+'</th><th class="n">'+esc(t("nbMembers"))+'</th><th class="n">'+esc(t("savings"))+'</th><th class="n">'+esc(t("toRecover"))+'</th><th></th></tr>';
    vis.forEach(function(r){h+='<tr><td><b>'+esc(r.g.nom)+'</b><span class="sub">'+esc(place(r.g))+'</span></td><td>'+esc(r.src)+(r.recu?'<span class="sub">'+esc(t("updated"))+' '+fdate(r.recu)+'</span>':'')+'</td><td class="n">'+r.m+'</td><td class="n">'+f(r.s.ep)+'</td><td class="n">'+f(r.s.enc)+(r.s.late.length?' ⚠':'')+'</td><td class="n"><button class="x" data-gv="'+r.g.id+'">👁</button>'+(r.mine?'':'<button class="x" data-gd="'+r.g.id+'">×</button>')+'</td></tr>'});
    h+='</table><button class="btn sec full" id="gCsv">'+esc(t("exportCsv"))+'</button></div>';
  }
  $("view").innerHTML=h;
  $("fR").onchange=function(){gFilter.region=this.value;gFilter.cercle="";gFilter.commune="";render()};
  $("fC").onchange=function(){gFilter.cercle=this.value;gFilter.commune="";render()};
  $("fM").onchange=function(){gFilter.commune=this.value;render()};
  $("gImp").onclick=function(){var v=$("gPaste").value.trim();if(v&&importPacket(v))render()};
  $("gFile").onchange=function(){var fl=this.files&&this.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){if(importPacket(String(rd.result)))render()};rd.readAsText(fl)};
  document.querySelectorAll("[data-gv]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-gv"),r=rows.find(function(x){return x.g.id===id});var txt=reportText(r.g);
    modal('<h3>'+esc(t("groupDetail"))+'</h3><textarea class="big" readonly>'+esc(txt)+'</textarea><div class="actions"><button class="btn sec" id="gvNo">'+esc(t("close"))+'</button><button class="btn" id="gvCp">'+esc(t("copyText"))+'</button></div>',function(m,close){$("gvNo").onclick=close;$("gvCp").onclick=function(){copyText(txt,t("textCopied"))}})}});
  document.querySelectorAll("[data-gd]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-gd");ask(t("removeImportQ",{n:globalDb[id].g.nom}),t("remove"),function(){delete globalDb[id];saveGlobal();render()})}});
  if($("gCsv"))$("gCsv").onclick=function(){
    var head=[t("colGroup"),t("region"),t("cercle"),t("commune"),t("village"),t("colAnim"),t("nbMembers"),t("savings"),t("social"),t("toRecover"),t("lateCount"),t("cash"),t("updated")];
    var q=function(v){v=String(v==null?"":v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    var lines=[head.map(q).join(";")];
    vis.forEach(function(r){lines.push([r.g.nom,r.g.region,r.g.cercle,r.g.commune,r.g.village,r.src,r.m,Math.round(r.s.ep),Math.round(r.s.so),Math.round(r.s.enc),r.s.late.length,Math.round(r.s.caisse),r.recu?fdate(r.recu):""].map(q).join(";"))});
    var csv="﻿"+lines.join("\n");
    shareFileOrCopy(csv,"base-globale-avec-"+today()+".csv","text/csv",t("csvCopied"));
  };
}
function vWelcome(){
  $("view").innerHTML='<div class="card" style="text-align:center;padding:24px 16px"><div style="font-size:40px">🤝</div><h2 style="margin-top:6px">'+esc(t("welcome"))+'</h2><p class="muted">'+esc(t("welcomeTxt"))+'</p><button class="btn full" id="w1">'+esc(t("createFirst"))+'</button></div>'+
  '<div class="card muted"><b>'+esc(t("how"))+'</b><ol>'+t("steps").map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ol></div>';
  $("w1").onclick=function(){groupForm(null)};
}
function applyChrome(){
  document.documentElement.lang=lang;
  $("appTitle").textContent=t("appTitle");
  $("newGroupBtn").textContent=t("newGroup");
  $("langSel").value=lang;
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"))});
  $("status").textContent=t(statusKey);
  $("foot").textContent=t("copyright");
}
function render(){
  applyChrome();
  var sel=$("groupSel"),ids=Object.keys(groups).sort(function(a,b){return groups[a].nom.localeCompare(groups[b].nom)});
  if(currentId&&!groups[currentId])currentId=null;
  if(!currentId&&ids.length)currentId=ids[0];
  sel.innerHTML=ids.length?ids.map(function(id){return '<option value="'+id+'"'+(id===currentId?" selected":"")+'>'+esc(groups[id].nom)+'</option>'}).join(""):'<option>'+esc(t("noGroup"))+'</option>';
  sel.disabled=!ids.length;
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-v")===view)});
  $("nav").classList.toggle("hidden",!g()&&view!=="share"&&view!=="global");
  if(view==="share"){vShare();return}
  if(view==="global"){vGlobal();return}
  var gr=g();if(!gr){vWelcome();return}
  ({home:vHome,members:vMembers,meeting:vMeeting,loans:vLoans,docs:vDocs,report:vReport})[view](gr);
}

/* ---------- démarrage ---------- */
$("langSel").onchange=function(){lang=this.value;try{localStorage.setItem(LANG_KEY,lang)}catch(e){}render()};
$("groupSel").onchange=function(){currentId=this.value;saveLocal();render()};
$("newGroupBtn").onclick=function(){groupForm(null)};
$("menuBtn").onclick=openMenu;
document.querySelectorAll("#nav button").forEach(function(b){b.onclick=function(){view=b.getAttribute("data-v");render();window.scrollTo(0,0)}});
loadLocal();render();startCloud();
})();
</script>

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});}
