<title>Caisse AVEC – Gestion de tontine</title>
<style>
:root{--g:#1f6b4a;--g2:#e6f2ec;--o:#d9822b;--o2:#fbefe2;--r:#b3261e;--r2:#fbe7e5;--t:#1d2421;--m:#5d6a64;--b:#dde4e0;--bg:#f6f8f7;--w:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--t);font-size:16px;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:17px;font-weight:700;flex:1}
#langSel{width:auto;padding:5px 6px;font-size:13px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:#fff}
#langSel option{color:#1d2421}
header .row{display:flex;gap:8px;align-items:center;margin-top:8px}
header .row select{flex:1;padding:8px;border-radius:8px;border:0;font-size:15px;background:#fff;color:var(--t)}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px;white-space:nowrap}
#status{font-size:12px;opacity:.85;margin-top:4px}
main{padding:14px;max-width:720px;margin:0 auto}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:10px}
.kpi .l{font-size:12px;color:var(--m)}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.kpi.main{grid-column:1/3;background:var(--g);color:#fff;border:0}
.kpi.main .l{color:#d6eadf}.kpi.main .v{font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;color:var(--m);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:16px;background:#fff;color:var(--t)}
textarea{min-height:120px;font-family:inherit;font-size:14px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--g2);color:var(--g)}
.btn.o{background:var(--o)}
.btn.d{background:var(--r2);color:var(--r)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;margin-top:10px}
.x{background:none;border:0;color:var(--m);font-size:18px;padding:2px 6px;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.tag.ok{background:var(--g2);color:var(--g)}.tag.late{background:var(--r2);color:var(--r)}.tag.run{background:var(--o2);color:#8a4c0f}
.muted{color:var(--m);font-size:13px}
.empty{text-align:center;color:var(--m);padding:22px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alert{background:var(--r2);color:var(--r);border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.meet td input{padding:7px;font-size:15px}
.hidden{display:none}
ol{margin:6px 0 0;padding-left:20px}
</style>
</head>

      <option value="bm">Bamanankan</option>

  <div class="row">
    <select id="groupSel" aria-label="Groupe"></select>
    <button id="newGroupBtn">+</button>

  <div id="status"></div>
</header>
<main id="view"></main>
<nav id="nav">

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0}
function f(n){return Math.round(n).toLocaleString("fr-FR")+" F"}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){if(!s)return"";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function addMonths(s,m){var d=new Date(s+"T12:00:00");d.setMonth(d.getMonth()+Math.round(m));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sum(a,fn){return a.reduce(function(s,x){return s+fn(x)},0)}
function $(id){return document.getElementById(id)}
function toast(msg){var el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},2200)}
function g(){return groups[currentId]||null}
function mName(gr,id){var m=gr.membres.find(function(x){return x.id===id});return m?m.nom:t("deleted")}
function normalize(x){x.membres=x.membres||[];x.cotisations=x.cotisations||[];x.prets=x.prets||[];x.remboursements=x.remboursements||[];x.part=num(x.part);x.taux=num(x.taux);x.social=num(x.social);return x}

function setStatus(k){statusKey=k;$("status").textContent=t(k)}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({groups:groups,currentId:currentId}))}catch(e){}}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(s&&s.groups){groups=s.groups;currentId=s.currentId;Object.keys(groups).forEach(function(k){normalize(groups[k])})}}catch(e){}}
function persist(gr){
  if(mode==="cloud"&&col){
    var id=gr.id,body=JSON.parse(JSON.stringify(gr));lastJson[id]=JSON.stringify(body);
    var prev=writeChains[id]||Promise.resolve();
    writeChains[id]=prev.then(function(){return col.doc(id).set(body)}).then(function(){setStatus("saved")},function(e){setStatus("saveFail");if(e&&e.code==="quota_exceeded")toast(t("full"))});
  }
  saveLocal();
}
function removeGroup(id){
  delete groups[id];
  if(mode==="cloud"&&col){var prev=writeChains[id]||Promise.resolve();writeChains[id]=prev.then(function(){return col.doc(id).delete()}).catch(function(){})}
  saveLocal();
}
function fallback(){mode="local";setStatus("offline")}
function startCloud(){
  if(!window.claude||typeof window.claude.use!=="function"){fallback();return}
  setStatus("connecting");
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user){fallback();return}
    return user.id().then(function(id){
      if(!id){fallback();return}
      col=db.collection("data/users/"+id);
      var timer=setTimeout(function(){setStatus("slow")},10000),first=true;
      col.onSnapshot(function(snap){
        if(!snap.metadata.fromCache)clearTimeout(timer);
        var remote={};
        snap.docs.forEach(function(d){if(d.exists){var b=d.data();if(b&&b.id)remote[b.id]=normalize(JSON.parse(JSON.stringify(b)))}});
        if(first){first=false;mode="cloud";Object.keys(groups).forEach(function(k){if(!remote[k]){remote[k]=groups[k];persist(groups[k])}})}
        var changed=false;
        Object.keys(remote).forEach(function(k){var j=JSON.stringify(remote[k]);if(lastJson[k]!==j){lastJson[k]=j;groups[k]=remote[k];changed=true}});
        if(!snap.metadata.fromCache){Object.keys(groups).forEach(function(k){if(!remote[k]&&!writeChains[k]){delete groups[k];changed=true}});setStatus("synced")}
        saveLocal();if(changed)render();
      },function(){clearTimeout(timer);mode="local";setStatus("offline")});
    });
  }).catch(fallback);
}

/* ---------- calculs ---------- */
function loanInfo(gr,p){
  var du=p.montant*(1+(p.taux/100)*p.duree);
  var paye=sum(gr.remboursements.filter(function(r){return r.pretId===p.id}),function(r){return r.montant});
  var reste=Math.max(0,du-paye),ech=addMonths(p.date,p.duree);
  return {du:du,paye:paye,reste:reste,ech:ech,st:reste<=0.5?"ok":(ech<today()?"late":"run")};
}
function stats(gr){
  var ep=sum(gr.cotisations,function(c){return c.epargne}),so=sum(gr.cotisations,function(c){return c.social});
  var pr=sum(gr.prets,function(p){return p.montant}),rb=sum(gr.remboursements,function(r){return r.montant});
  var enc=0,late=[],interets=0;
  gr.prets.forEach(function(p){var i=loanInfo(gr,p);enc+=i.reste;interets+=i.du-p.montant;if(i.st==="late")late.push({p:p,i:i})});
  return {ep:ep,so:so,caisse:ep+so+rb-pr,enc:enc,late:late,interets:interets};
}
function memberStats(gr,m){
  var ep=sum(gr.cotisations.filter(function(c){return c.membreId===m.id}),function(c){return c.epargne}),reste=0;
  gr.prets.filter(function(p){return p.membreId===m.id}).forEach(function(p){reste+=loanInfo(gr,p).reste});
  return {ep:ep,reste:reste};
}

$("langSel").onchange=function(){lang=this.value;try{localStorage.setItem(LANG_KEY,lang)}catch(e){}render()};
$("groupSel").onchange=function(){currentId=this.value;saveLocal();render()};
$("newGroupBtn").onclick=function(){groupForm(null)};
document.querySelectorAll("#nav button").forEach(function(b){b.onclick=function(){view=b.getAttribute("data-v");render();window.scrollTo(0,0)}});
loadLocal();render();startCloud();
})();
