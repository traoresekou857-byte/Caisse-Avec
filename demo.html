<style>
:root{--g:#1f6b4a;--g2:#e6f2ec;--o:#d9822b;--o2:#fbefe2;--r:#b3261e;--r2:#fbe7e5;--t:#1d2421;--m:#5d6a64;--b:#dde4e0;--bg:#f6f8f7;--w:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--t);font-size:16px;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:12px 14px 10px;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:15px;font-weight:700;flex:1;line-height:1.25}
#menuBtn{font-size:18px;padding:4px 10px}
.qrbox{text-align:center;padding:10px 0}.qrbox svg{max-width:80vw;height:auto;border:8px solid #fff;border-radius:8px}
.url{word-break:break-all;font-size:13px;background:var(--g2);padding:8px;border-radius:8px;color:var(--g)}
.menuitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--b);border-radius:10px;padding:12px;font-size:15px;margin-bottom:8px;cursor:pointer;color:var(--t)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.filters select{padding:7px;font-size:13px}
table.small td,table.small th{font-size:12px;padding:6px 3px}
#langSel{width:auto;padding:5px 6px;font-size:13px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:#fff}
#langSel option{color:#1d2421}
header .row{display:flex;gap:8px;align-items:center;margin-top:8px}
header .row select{flex:1;padding:8px;border-radius:8px;border:0;font-size:15px;background:#fff;color:var(--t)}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px;white-space:nowrap}
#status{font-size:12px;opacity:.85;margin-top:4px}
main{padding:14px;max-width:720px;margin:0 auto}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--w);border:1px solid var(--b);border-radius:12px;padding:10px}
.kpi .l{font-size:12px;color:var(--m)}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.kpi.main{grid-column:1/3;background:var(--g);color:#fff;border:0}
.kpi.main .l{color:#d6eadf}.kpi.main .v{font-size:24px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--b);vertical-align:middle}
th{font-size:12px;color:var(--m);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:16px;background:#fff;color:var(--t)}
textarea{min-height:120px;font-family:inherit;font-size:14px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--g2);color:var(--g)}
.btn.o{background:var(--o)}
.btn.d{background:var(--r2);color:var(--r)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;margin-top:10px}
.x{background:none;border:0;color:var(--m);font-size:18px;padding:2px 6px;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.tag.ok{background:var(--g2);color:var(--g)}.tag.late{background:var(--r2);color:var(--r)}.tag.run{background:var(--o2);color:#8a4c0f}
.muted{color:var(--m);font-size:13px}
.empty{text-align:center;color:var(--m);padding:22px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.offer{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.offer .pr{font-size:18px;font-weight:700;color:var(--g)}
.btn.wa{background:#25D366}
a.btn{text-decoration:none;text-align:center}
.alert{background:var(--r2);color:var(--r);border-radius:10px;padding:10px;font-size:14px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:17px}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.meet td input{padding:7px;font-size:15px}
.hidden{display:none}
ol{margin:6px 0 0;padding-left:20px}
.seg{display:flex;gap:6px;margin:4px 0 12px}.seg button{flex:1;padding:9px 6px;border:1px solid var(--b);background:#fff;border-radius:10px;font-size:14px;color:var(--m);cursor:pointer}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--b);font-size:15px}.chk input{width:20px;height:20px;flex:none}
textarea.big{min-height:380px;font-size:14px;line-height:1.45}
#foot{text-align:center;font-size:11px;color:var(--m);padding:6px 0 16px}
.sub{display:block;font-size:12px;color:var(--m)}
</style>
</head>

nd les grandes décisions. Le Comité de gestion comprend : un(e) Président(e), un(e) Secrétaire, un(e) Trésorier(ère) et deux Compteurs(euses), élus pour un cycle.\\n\\nArticle 5 – Réunions\\nLe groupe se réunit chaque ______ (jour) à ______ (heure). La présence est obligatoire.\\nRetard : amende de 100 F. Absence sans excuse : amende de 200 F.\\n\\nArticle 6 – Épargne\\nLa valeur d'une part est de 500 F. Chaque membre choisit son nombre de parts à l'adhésion ; ce nombre reste le même à chaque réunion jusqu'à la fin du cycle.\\n\\nArticle 7 – Fonds social\\nChaque membre verse 100 F par réunion au fonds social. Il sert à aider les membres en cas de maladie, de décès ou d'autre événement grave. Ces aides ne sont pas remboursables. Le montant de chaque aide est décidé par l'Assemblée.\\n\\nArticle 8 – Crédit\\nUn membre peut emprunter jusqu'à 3 fois le montant de son épargne. L'intérêt est de 10 % par mois. La durée maximale d'un prêt est de 3 mois. Tout prêt doit être remboursé avant la fin du cycle.\\n\\nArticle 9 – Retard de remboursement\\nEn cas de retard, le membre paie une pénalité de 500 F et le Comité l'aide à trouver une solution. Aucun nouveau prêt n'est accordé tant que le précédent n'est pas remboursé.\\n\\nArticle 10 – Sécurité de la caisse\\nLa caisse est fermée par 3 cadenas. Les 3 clés sont gardées par 3 membres différents, qui ne font pas partie du Comité de gestion. La caisse n'est ouverte qu'en réunion, devant tous les membres.\\n\\nArticle 11 – Cycle et partage\\nLe cycle dure ______ mois. À la fin du cycle, l'épargne et les gains (intérêts, amendes) sont partagés entre les membres en proportion du nombre de parts achetées par chacun.\\n\\nArticle 12 – Départ et exclusion\\nUn membre qui quitte le groupe ou qui est exclu récupère son épargne, moins ses dettes envers le groupe. Tout membre qui ne respecte pas gravement le règlement peut être exclu par décision de l'Assemblée.\\n\\nArticle 13 – Modification\\nLe présent règlement peut être modifié par l'Assemblée générale à la majorité des deux tiers (2/3) des membres.\\n\\nFait à Kola, Kola, Bougouni, Sikasso, Mali, le 11/11/2026\\n\\nComité de gestion :\\n- Président(e) : Awa Diarra (76110011)\\n- Secrétaire : Kadia Traoré (66220022)\\n- Trésorier(ère) : Fanta Koné (70330033)\\n- Contrôleur(euse) 1 : Mariam Sidibé (79440044)\\n- Contrôleur(euse) 2 : Oumou Sangaré (65550055)\\n\\nSignatures :\\nPrésident(e) : ____________\\nSecrétaire : ____________\\nTrésorier(ère) : ____________\",\"amendes\":[{\"id\":\"mwclq81vgewwy\",\"date\":\"2026-11-11\",\"membreId\":\"mwclq4zos9cls\",\"type\":\"retard\",\"montant\":100,\"motif\":\"\",\"paye\":true,\"datePaye\":\"2026-11-11\"},{\"id\":\"mwclq87usgeoj\",\"date\":\"2026-11-11\",\"membreId\":\"mwclq574ec61g\",\"type\":\"absence\",\"montant\":200,\"motif\":\"\",\"paye\":false,\"datePaye\":\"\"}],\"agr\":[{\"id\":\"mwclq91h7b5yc\",\"membreId\":\"mwclq4o586wtl\",\"activite\":\"Karité\",\"produit\":\"Beurre de karité\",\"prix\":1500,\"unite\":\"kg\",\"quantite\":\"40\",\"description\":\"Beurre de karité pur, en pots de 1 kg\",\"contact\":\"76110011\",\"publier\":true},{\"id\":\"mwclq9aqm4hbk\",\"membreId\":\"mwclq4w0o1820\",\"activite\":\"Produits transformés\",\"produit\":\"Soumbala\",\"prix\":3000,\"unite\":\"kg\",\"quantite\":\"15\",\"description\":\"\",\"contact\":\"76110011\",\"publier\":true}],\"amendesCfg\":{\"retard\":100,\"absence\":200,\"remb\":500},\"bureau\":[{\"poste\":\"pres\",\"prenom\":\"Awa\",\"nom\":\"Diarra\",\"tel\":\"76110011\"},{\"poste\":\"sec\",\"prenom\":\"Kadia\",\"nom\":\"Traoré\",\"tel\":\"66220022\"},{\"poste\":\"tres\",\"prenom\":\"Fanta\",\"nom\":\"Koné\",\"tel\":\"70330033\"},{\"poste\":\"ctrl1\",\"prenom\":\"Mariam\",\"nom\":\"Sidibé\",\"tel\":\"79440044\"},{\"poste\":\"ctrl2\",\"prenom\":\"Oumou\",\"nom\":\"Sangaré\",\"tel\":\"65550055\"}],\"village\":\"Kola\",\"pays\":\"Mali\",\"lieu\":\"Kola\",\"part\":500,\"taux\":10,\"social\":100,\"nom\":\"Benkadi de Kola\",\"region\":\"Sikasso\",\"cercle  qu'en réunion, devant tous les membres.\\n\\nArticle 11 – Cycle et partage\\nLe cycle dure ______ mois. À la fin du cycle, l'épargne et les gains (intérêts, amendes) sont partagés entre les membres en proportion du nombre de parts achetées par chacun.\\n\\nArticle 12 – Départ et exclusion\\nUn membre qui quitte le groupe ou qui est exclu récupère son épargne, moins ses dettes envers le groupe. Tout membre qui ne respecte pas gravement le règlement peut être exclu par décision de l'Assemblée.\\n\\nArticle 13 – Modification\\nLe présent règlement peut être modifié par l'Assemblée générale à la majorité des deux tiers (2/3) des membres.\\n\\nFait à Kéléya, Kéléya, Bougouni, Sikasso, Mali, le 11/11/2026\\n\\nComité de gestion :\\n- Président(e) : Rokia Koné (66445566)\\n- Secrétaire : Nana Keïta (65001122)\\n- Trésorier(ère) : Kadi Sow (79001122)\\n- Contrôleur(euse) 1 : Sali Traoré (70112233)\\n- Contrôleur(euse) 2 : Hawa Bengaly (76223344)\\n\\nSignatures :\\nPrésident(e) : ____________\\nSecrétaire : ____________\\nTrésorier(ère) : ____________\",\"amendes\":[{\"id\":\"mwclqch51ch5e\",\"date\":\"2026-11-11\",\"membreId\":\"mwclqacpf9c8k\",\"type\":\"retard\",\"montant\":100,\"motif\":\"\",\"paye\":true,\"datePaye\":\"2026-11-11\"}],\"agr\":[{\"id\":\"mwclqd9chrt70\",\"membreId\":\"mwclqa1mg36wk\",\"activite\":\"Karité\",\"produit\":\"Savon au karité\",\"prix\":250,\"unite\":\"morceau\",\"quantite\":\"30\",\"description\":\"Savon au beurre de karité\",\"contact\":\"66445566\",\"publier\":true}],\"amendesCfg\":{\"retard\":100,\"absence\":200,\"remb\":500},\"bureau\":[{\"poste\":\"pres\",\"prenom\":\"Rokia\",\"nom\":\"Koné\",\"tel\":\"66445566\"},{\"poste\":\"sec\",\"prenom\":\"Nana\",\"nom\":\"Keïta\",\"tel\":\"65001122\"},{\"poste\":\"tres\",\"prenom\":\"Kadi\",\"nom\":\"Sow\",\"tel\":\"79001122\"},{\"poste\":\"ctrl1\",\"prenom\":\"Sali\",\"nom\":\"Traoré\",\"tel\":\"70112233\"},{\"poste\":\"ctrl2\",\"prenom\":\"Hawa\",\"nom\":\"Bengaly\",\"tel\":\"76223344\"}],\"vil  rulesTpl:"RÈGLEMENT INTÉRIEUR\n« {nom} »\n\nArticle 1 – Dénomination et siège\nIl est créé entre les membres une Association Villageoise d'Épargne et de Crédit (AVEC) dénommée « {nom} », dont le siège est à {lieu}.\n\nArticle 2 – Objectifs\nLe groupe permet à ses membres d'épargner régulièrement, d'obtenir de petits crédits et de s'entraider en cas de difficulté grâce au fonds social.\n\nArticle 3 – Adhésion\nPeut devenir membre toute personne volontaire, âgée d'au moins 18 ans, résidant dans la localité et qui accepte le présent règlement. L'adhésion se fait au début du cycle. Le groupement compte au maximum 30 membres.\n\nArticle 4 – Organes\nL'Assemblée générale (tous les membres) prend les grandes décisions. Le Comité de gestion comprend : un(e) Président(e), un(e) Secrétaire, un(e) Trésorier(ère) et deux Compteurs(euses), élus pour un cycle.\n\nArticle 5 – Réunions\nLe groupe se réunit chaque ______ (jour) à ______ (heure). La présence est obligatoire.\nRetard : amende de ______ F. Absence sans excuse : amende de ______ F.\n\nArticle 6 – Épargne\nLa valeur d'une part est de {part}. Chaque membre choisit son nombre de parts à l'adhésion ; ce nombre reste le même à chaque réunion jusqu'à la fin du cycle.\n\nArticle 7 – Fonds social\nChaque membre verse {social} par réunion au fonds social. Il sert à aider les membres en cas de maladie, de décès ou d'autre événement grave. Ces aides ne sont pas remboursables. Le montant de chaque aide est décidé par l'Assemblée.\n\nArticle 8 – Crédit\nUn membre peut emprunter jusqu'à 3 fois le montant de son épargne. L'intérêt est de {taux} % par mois. La durée maximale d'un prêt est de 3 mois. Tout prêt doit être remboursé avant la fin du cycle.\n\nArticle 9 – Retard de remboursement\nEn cas de retard, le membre paie une pénalité de ______ F et le Comité l'aide à trouver une solution. Aucun nouveau prêt n'est accordé tant que le précédent n'est pas remboursé.\n\nArticle 10 – Sécurité de la caisse\nLa caisse est fermée par 3 cadenas. Les 3 clés sont gardées par 3 membres différents, qui ne font pas partie du Comité de gestion. La caisse n'est ouverte qu'en réunion, devant tous les membres.\n\nArticle 11 – Cycle et partage\nLe cycle dure ______ mois. À la fin du cycle, l'épargne et les gains (intérêts, amendes) sont partagés entre les membres en proportion du nombre de parts achetées par chacun.\n\nArticle 12 – Départ et exclusion\nUn membre qui quitte le groupe ou qui est exclu récupère son épargne, moins ses dettes envers le groupe. Tout membre qui ne respecte pas gravement le règlement peut être exclu par décision de l'Assemblée.\n\nArticle 13 – Modification\nLe présent règlement peut être modifié par l'Assemblée générale à la majorité des deux tiers (2/3) des membres.\n\nFait à {lieu}, le {date}\n\nSignatures :\nPrésident(e) : ____________\nSecrétaire : ____________\nTrésorier(ère) : ____________"

 rulesTpl:"TƆN SARIYASƐBƐN\n« {nom} »\n\nSariya 1 – Tɔgɔ ni sigiyɔrɔ\nTɔndenw ye Wari Maracɛ ni Juru Tɔn (AVEC) dabɔ, a tɔgɔ ye « {nom} ». A sigiyɔrɔ ye {lieu} ye.\n\nSariya 2 – Laɲiniw\nTɔn in b'a to tɔndenw ka wari mara tuma bɛɛ, ka juru fitininw sɔrɔ, ka ɲɔgɔn dɛmɛ gɛlɛya waati la dɛmɛ kɛsu fɛ.\n\nSariya 3 – Donni tɔn na\nMɔgɔ o mɔgɔ ye san 18 sɔrɔ, ni a sigilen bɛ dugu in kɔnɔ, ni a sɔnna nin sariyaw ma, o bɛ se ka don tɔn na. Donni bɛ kɛ sikili daminɛ na. Tɔn tɛ se ka tɛmɛ tɔnden 30 kan.\n\nSariya 4 – Ɲɛmɔgɔw\nTɔndenw bɛɛ ka Ɲɔgɔnye ba de bɛ latigɛ kunbabaw ta. Ɲɛnabɔ jɛkulu bɛ kɛ ni Ɲɛmɔgɔ ye, Sɛbɛnnikɛla, Wari marabaga ani Wari jatebaga fila. U bɛ sugandi sikili kelen kama.\n\nSariya 5 – Ɲɔgɔnyew\nTɔn bɛ ɲɔgɔn ye ______ (don) o don, ______ (waati). Bɛɛ ka kan ka na.\nNi mɔgɔ nana kɔ fɛ : ______ F. Ni mɔgɔ ma na sababu tɛ : ______ F.\n\nSariya 6 – Wari marali\nNiyɔrɔ kelen sɔngɔ ye {part} ye. Tɔnden kelen kelen bɛ a ka niyɔrɔ hakɛ sugandi a donni waati la ; o hakɛ bɛ to a cogo la ɲɔgɔnye bɛɛ la fo sikili ka ban.\n\nSariya 7 – Dɛmɛ kɛsu\nTɔnden kelen kelen bɛ {social} don dɛmɛ kɛsu kɔnɔ ɲɔgɔnye o ɲɔgɔnye. A bɛ tɔndenw dɛmɛ bana, saya walima gɛlɛya wɛrɛ waati la. O dɛmɛ tɛ sara kokura. Ɲɔgɔnye ba de bɛ dɛmɛ hakɛ latigɛ.\n\nSariya 8 – Juru\nTɔnden bɛ se ka juru ta fo a ka maralen siɲɛ 3. Juru tɔnɔ ye {taux} % ye kalo o kalo. Juru waati janya laban ye kalo 3 ye. Juru bɛɛ ka kan ka sara sani sikili ka ban.\n\nSariya 9 – Juru sarali mɛnni\nNi juru sarali mɛnna, tɔnden bɛ ______ F sara, Ɲɛnabɔ jɛkulu b'a dɛmɛ ka fɛɛrɛ sɔrɔ. Juru kura tɛ di ni kɔrɔ ma sara fɔlɔ.\n\nSariya 10 – Kɛsu lakanani\nKɛsu bɛ datugu ni kadenasi 3 ye. Kile 3 bɛ tɔnden 3 bolo, minnu tɛ Ɲɛnabɔ jɛkulu la. Kɛsu tɛ da wuli fo ɲɔgɔnye la, tɔndenw bɛɛ ɲɛ kɔrɔ.\n\nSariya 11 – Sikili ni tilali\nSikili bɛ kalo ______ kɛ. Sikili laban na, maralen ni tɔnɔw (juru tɔnɔ, hakɛw) bɛ tila tɔndenw cɛ ka kɛɲɛ ni u kelen kelen ka niyɔrɔ sannenw ye.\n\nSariya 12 – Bɔli ni gɛnni\nTɔnden min bɔra tɔn na walima min gɛnna, o bɛ a ka maralen sɔrɔ, a ka juru bɔlen a la. Tɔnden min ma sariyaw bonya kosɛbɛ, Ɲɔgɔnye ba bɛ se k'a gɛn.\n\nSariya 13 – Sariyaw yɛlɛmani\nƝɔgɔnye ba bɛ se ka nin sariyaw yɛlɛma ni tɔndenw tilayɔrɔ saba la fila (2/3) sɔnna.\n\nA kɛra {lieu}, {date}\n\nBolonɔw :\nƝɛmɔgɔ : ____________\nSɛbɛnnikɛla : ____________\nWari marabaga : ____________"
},

 rulesTpl:"BY-LAWS\n“{nom}”\n\nArticle 1 – Name and seat\nThe members hereby create a Village Savings and Loan Association (VSLA) named “{nom}”, based in {lieu}.\n\nArticle 2 – Objectives\nThe group enables its members to save regularly, obtain small loans and support each other in hard times through the social fund.\n\nArticle 3 – Membership\nAny volunteer aged 18 or over, living in the area and accepting these by-laws may become a member. New members join at the start of a cycle. The group has a maximum of 30 members.\n\nArticle 4 – Governing bodies\nThe General Assembly (all members) takes the main decisions. The Management Committee consists of a Chairperson, a Secretary, a Treasurer and two Money Counters, elected for one cycle.\n\nArticle 5 – Meetings\nThe group meets every ______ (day) at ______ (time). Attendance is compulsory.\nLateness: fine of ______ F. Unexcused absence: fine of ______ F.\n\nArticle 6 – Savings\nThe value of one share is {part}. Each member chooses their number of shares when joining; this number stays the same at every meeting until the end of the cycle.\n\nArticle 7 – Social fund\nEach member pays {social} per meeting into the social fund. It helps members in case of illness, death or other serious events. This help is not repaid. The amount of each grant is decided by the Assembly.\n\nArticle 8 – Loans\nA member may borrow up to 3 times their savings. Interest is {taux}% per month. The maximum loan period is 3 months. All loans must be repaid before the end of the cycle.\n\nArticle 9 – Late repayment\nIn case of late repayment, the member pays a penalty of ______ F and the Committee helps find a solution. No new loan is granted until the previous one is repaid.\n\nArticle 10 – Cash box security\nThe cash box is locked with 3 padlocks. The 3 keys are kept by 3 different members who are not on the Management Committee. The box is only opened during meetings, in front of all members.\n\nArticle 11 – Cycle and share-out\nThe cycle lasts ______ months. At the end of the cycle, savings and earnings (interest, fines) are shared among members in proportion to the number of shares each has bought.\n\nArticle 12 – Leaving and exclusion\nA member who leaves or is excluded gets back their savings minus any debts to the group. A member who seriously breaks these by-laws may be excluded by decision of the Assembly.\n\nArticle 13 – Amendments\nThese by-laws may be amended by the General Assembly with a two-thirds (2/3) majority of members.\n\nDone at {lieu}, on {date}\n\nSignatures:\nChairperson: ____________\nSecretary: ____________\nTreasurer: ____________"
}};

var MODULES=[
{id:"mjt1",grp:"mjt",n:1,icon:"🤝",titre:"Le groupement et l'Assemblée Générale",duree:"1 réunion (60 à 90 min)",methode:"Questions – discussion",
obj:["Comprendre ce qu'est un groupement et ce qui le distingue d'un simple rassemblement","Connaître le rôle de l'Assemblée Générale (AG), organe suprême du groupement","Connaître les conditions de mise en place d'un groupement MJT"],
etapes:["Rappel de la réunion préalable par les participantes","Partir de l'expérience des femmes : quels groupements connaissent-elles ?","Construire ensemble la définition d'un groupement","Comparer groupement et rassemblement (tableau)","Présenter les conditions de mise en place","Expliquer l'AG avec l'image du corps humain","Premier versement d'épargne, synthèse et annonce du thème suivant"],
cles:["Un groupement est une association de personnes qui mettent leurs ressources ensemble pour satisfaire les besoins de ses membres.","Le groupement dure dans le temps, a un but commun, des responsables et des règles ; le rassemblement est ponctuel et se dissout au premier problème.","Le groupement compte 30 à 35 membres au maximum, qui assistent régulièrement aux réunions hebdomadaires.","L'AG regroupe toutes les membres : c'est elle qui décide, élit le comité, contrôle son travail et peut le remplacer.","« Une femme, une voix » : toutes les membres ont les mêmes droits.","Image : l'AG est la tête, le comité de gestion les bras, le règlement intérieur les pieds sur lesquels tout repose."],
recit:"Au village, 40 femmes se sont réunies pour accueillir une délégation. Le lendemain, chacune est rentrée chez elle et plus rien ne les liait. Dans le village voisin, 30 femmes se retrouvent chaque semaine depuis deux ans : elles ont un comité, des règles et une caisse.",
questions:["Quelle différence voyez-vous entre ces deux situations ?","Qui prend les décisions importantes dans un groupement ?","Que peut faire l'AG si le comité ne fait pas bien son travail ?"],
retenir:"Le pouvoir appartient à l'Assemblée Générale. Le comité est à son service et lui rend compte."},
{id:"mjt2",grp:"mjt",n:2,icon:"🗳️",titre:"Le comité de gestion : rôles et élection",duree:"1 réunion + 1 formation du comité",methode:"Récits – questions – discussion",
obj:["Comprendre pourquoi le groupement a besoin d'un comité de gestion","Connaître les postes, rôles, qualités et responsabilités","Élire le comité et fixer la durée de son mandat"],
etapes:["Rappel de la réunion précédente","Récit 1 : l'argent confié à une seule personne","Définir ensemble le comité de gestion","Passer en revue chaque poste : qualités et rôles","Récit 2 : choisir selon les compétences et non le rang social","Élection, présentation des élues, fixation du mandat","Installation du comité face à l'assemblée (4 tasses, caisse à 3 clés)"],
cles:["Le comité de gestion est élu en AG, parmi les membres et par les membres, pour gérer les activités et l'argent du groupement.","Composition : 1 présidente, 1 secrétaire, 1 trésorière, 2 contrôleuses.","Présidente : dirige les réunions, fait respecter le règlement, représente le groupement, garde une clé.","Secrétaire : fait l'appel, enregistre versements, prêts et remboursements, rend compte, garde une clé.","Trésorière : garde la caisse en sécurité chez elle, mais ne touche jamais à l'argent pendant les opérations.","Contrôleuses : comptent et vérifient chaque mouvement d'argent ; l'une d'elles garde la 3e clé.","La caisse ne s'ouvre qu'en présence des 3 gardes-clés. En cas de perte due au comité, celui-ci rembourse.","Le mandat est une durée fixée par l'AG ; il est inscrit dans le règlement intérieur."],
recit:"À Lafiabougou, les femmes ont remis la cotisation à la plus âgée, qui l'a enterrée chez elle sans rien noter. La semaine suivante, personne ne savait combien il y avait, ni qui avait versé.",
questions:["Quel est le problème de ces femmes ?","Comment l'éviter ?","Quelles qualités doit avoir chaque membre du comité ?"],
retenir:"On élit les responsables pour leurs compétences et leur honnêteté, pas pour leur rang social."},
{id:"mjt3",grp:"mjt",n:3,icon:"📜",titre:"Le règlement intérieur : élaboration et adoption",duree:"1 à 2 réunions",methode:"Récits – questions – discussion",
obj:["Comprendre la nécessité d'un règlement intérieur (RI)","Élaborer et adopter le RI en Assemblée Générale","Réfléchir aux objectifs et activités de la caisse"],
etapes:["Rappel de la réunion précédente","Exemples de règles connues (famille, village, école)","Définir le règlement intérieur","Discuter les récits (décès d'une emprunteuse, parts doubles, absences)","Parcourir le canevas point par point et noter les décisions","Relire le RI, obtenir l'accord de chaque membre, l'écrire dans la langue du groupe"],
cles:["Le RI est l'ensemble des règles qui organisent la vie du groupement ; il est fait par les membres et pour les membres.","Points non négociables : avoir un RI ; une membre = une voix ; comité élu par l'AG pour un mandat ; même montant d'épargne pour toutes ; intérêt sur chaque prêt ; sanctions prévues.","Points négociables : qui peut être membre, montant et rythme d'épargne, durée et taux des prêts, mandat, fonds social, amendes, partage.","Le canevas : membres ; versements ; critères de prêt ; remboursement ; amendes ; fonds social ; retrait ; décès ; objectif de la caisse.","Amendes possibles : absence sans raison, retard, perte de carte, bavardage, non-remboursement, comité qui ne joue pas son rôle…","Le RI peut être modifié en AG s'il n'est pas assez complet."],
recit:"Nagnouma a emprunté 10 000 F à la caisse ; elle n'a épargné que 1 500 F. Elle décède. Personne ne sait quoi faire, car rien n'était prévu.",
questions:["Que faire dans ce cas ?","Quelles règles faut-il écrire pour éviter ce genre de situation ?","Qui doit approuver le règlement ?"],
retenir:"Un règlement clair, connu et appliqué par toutes protège le groupement. Astuce : l'application génère un modèle de RI (onglet Documents)."},
{id:"mjt4",grp:"mjt",n:4,icon:"🎯",titre:"Définir un objectif commun",duree:"1 à 2 réunions",methode:"Récits – questions – discussion",
obj:["Amener le groupement à fixer un objectif commun clair (SMART)","Identifier et planifier les activités pour l'atteindre","Présenter le déroulement type d'une réunion"],
etapes:["Rappel de la réunion précédente","Recueillir les attentes des membres : que peut faire la caisse pour nous ?","Récits : la caisse sans objectif et la caisse avec un projet","Lister les idées, les classer par priorité","Retenir un ou plusieurs objectifs SMART","Planifier les activités dans le temps et inscrire l'objectif dans le RI"],
cles:["L'objectif global des caisses MJT : mobiliser des ressources par l'épargne et le crédit pour améliorer les revenus des membres.","Un bon objectif est SMART : Spécifique, Mesurable, Atteignable, Réaliste, défini dans le Temps.","Exemples : acheter un moulin dans 2 ans, stocker des céréales après la récolte, financer les intrants agricoles.","La durée des prêts est la même pour toutes (souvent 1 à 3 mois) ; le taux mensuel est fixé par l'AG (souvent 5 à 10 %).","Toutes les membres ne sont pas obligées de prendre un crédit."],
recit:"La caisse Allahidou n'avait rien décidé : certaines voulaient retirer de l'argent pour la fête, d'autres stocker des céréales. Les disputes ont commencé. La caisse Wafakoy, elle, avait décidé d'acheter un moulin au bout de 2 ans, avec des retraits prévus aux fêtes : tout s'est bien passé.",
questions:["Pourquoi Allahidou a eu des problèmes ?","Qu'auraient-elles dû faire ?","Quel est l'objectif de notre caisse ?"],
retenir:"Un objectif commun, écrit dans le RI, donne une direction et évite les conflits. Dans l'application : fiche du groupement, champ « Objectif »."},
{id:"mjt5",grp:"mjt",n:5,icon:"🕊️",titre:"La gestion des conflits",duree:"1 réunion",methode:"Récits – questions – discussion",
obj:["Savoir analyser un problème : sa source, sa cause, ses conséquences","Rechercher ensemble des solutions","Utiliser le règlement intérieur pour régler les conflits"],
etapes:["Rappel de la réunion précédente","Qu'est-ce qu'un problème ? En avez-vous ?","Récit de Koudedia et questions","L'arbre à problèmes : racines, tronc, branches","Recherche de solutions et rôle du médiateur","Présentation du déroulement type d'une réunion de caisse"],
cles:["Un problème est comme un arbre : les racines sont la source, le tronc la cause principale, les branches les conséquences.","Il faut agir sur la source, pas seulement sur les conséquences.","Tous les problèmes du groupement se règlent en AG, avant les opérations de caisse.","La discrétion sur les opérations de chacune est une règle de confiance.","Écoute active : écouter sans interrompre, reformuler, vérifier qu'on a bien compris.","Le médiateur reste neutre, donne le même temps de parole à chaque partie et cherche une solution gagnant-gagnant."],
recit:"Dans le groupe Horonya, Koudedia a emprunté 10 000 F, mais a dépensé l'argent pour le mariage de sa fille. Au moment de rembourser, elle n'a rien. Des membres l'insultent en public ; elle ne vient plus aux réunions.",
questions:["Qu'aurait dû faire Koudedia ?","Comment le groupement aurait-il dû réagir ?","Que prévoit notre RI dans ce cas ?"],
retenir:"Parler tôt, chercher la vraie cause, appliquer le règlement avec respect : c'est ainsi que le groupement reste uni."},
{id:"mjt6",grp:"mjt",n:6,icon:"💰",titre:"Épargne, crédit, intérêt et amende",duree:"1 à 2 réunions",methode:"Questions – discussion – récits – jeux de rôle",
obj:["Comprendre l'épargne et le crédit","Comprendre l'intérêt, son partage équitable, et l'amende","Réaliser toutes les opérations de caisse"],
etapes:["Rappel de la réunion précédente","L'épargne : pourquoi, sous quelles formes, épargne individuelle ou en groupe","Le crédit : différence avec le crédit du commerçant","L'intérêt : récit de la marmite rendue avec un plat de riz","Le partage des intérêts : récits de Sanata, Mouna et Bintou","L'amende : quand, combien, que devient l'argent","Jeu de rôle d'une réunion complète, puis premier octroi de prêts"],
cles:["Épargner, c'est mettre de côté ce dont on n'a pas besoin tout de suite, pour l'avenir ou les imprévus.","L'épargne en groupe est moins tentante à dépenser, rapporte des intérêts et donne accès au crédit.","Le crédit est une dette à rembourser selon des règles fixées (délai, intérêt). On n'emprunte que ce qu'on peut rembourser.","L'intérêt remercie toutes les membres d'avoir prêté leur argent : il appartient à la caisse et se partage équitablement.","L'amende est une sanction prévue par le RI ; elle va dans la caisse.","Réunion type : ouverture → versements → contrôle → remboursements → octroi de prêts → contrôle et fermeture de la caisse."],
recit:"Sanata emprunte chaque mois pour son commerce et paie beaucoup d'intérêts. Mouna n'emprunte jamais. Au partage, Sanata trouve injuste que Mouna reçoive autant qu'elle.",
questions:["Qui a raison ? Pourquoi ?","Sans l'épargne de Mouna, Sanata aurait-elle pu emprunter autant ?","Quelles amendes avons-nous fixées dans notre RI ?"],
retenir:"L'argent de la caisse appartient à toutes : celle qui épargne et celle qui emprunte ont les mêmes droits au partage."},
{id:"mjt7",grp:"mjt",n:7,icon:"🏛️",titre:"Services techniques, ONG et institutions financières",duree:"1 réunion, puis suivi selon les besoins",methode:"Questions – discussion (diagramme de Venn)",
obj:["Connaître les services techniques, ONG, institutions financières et autres structures de la zone","Savoir ce qu'ils peuvent apporter et à quelles conditions","Identifier les besoins du groupement et organiser la mise en relation"],
etapes:["Quels services, ONG et institutions financières connaissez-vous ?","Diagramme de Venn : qui est proche, qui est important pour le groupement","Présenter chaque structure : domaine, lieu, conditions d'appui","Repérer les besoins prioritaires des membres","Planifier les contacts et les formations utiles"],
cles:["Services techniques de l'État (permanents) : agriculture, élevage, santé, eaux et forêts, contrôle de la qualité…","ONG : interviennent par projets, pour un temps et un objectif précis.","Institutions financières (caisses, banques, systèmes financiers décentralisés) : comparer conditions, taux et garanties avant tout prêt.","Mairie : rôle de la commune, droits et devoirs des femmes envers la commune.","Administration et justice : récépissé, conflits qui dépassent le RI.","Chambre d'agriculture : défend les intérêts du monde rural, facilite l'accès aux intrants."],
recit:"Les femmes de Kola voulaient vacciner leurs volailles mais ne savaient pas à qui s'adresser. Après la réunion, elles ont invité l'agent d'élevage, qui a formé deux auxiliaires du village.",
questions:["Quels services sont présents dans notre commune ?","Lequel peut nous aider pour notre objectif ?","Qui va prendre le contact, et quand ?"],
retenir:"Le groupement n'est pas seul : bien connaître les partenaires permet d'obtenir conseils, formations et financements."},

{id:"lead",grp:"plus",icon:"⭐",titre:"Le leadership",duree:"90 min",methode:"Jeux de rôle – discussion",
obj:["Comprendre ce qu'est un bon leader","Identifier les styles de leadership","Renforcer la confiance en soi des femmes et des jeunes leaders"],
etapes:["Jeu : « Qui est un leader pour vous ? » (chacune cite une personne et dit pourquoi)","Lister les qualités d'un bon leader","Présenter 3 styles : autoritaire, laisser-faire, participatif","Jeu de rôle : une réunion menée dans chacun des styles","Discussion : quel style fait avancer le groupe ?","Engagement personnel : une action de leadership pour le mois"],
cles:["Un leader est une personne qui inspire et guide le groupe vers un objectif commun ; ce n'est pas forcément la plus âgée ou la plus riche.","Qualités : écoute, honnêteté, exemplarité, courage, capacité à décider et à rendre compte.","Le style participatif (on consulte, on décide ensemble) renforce l'engagement des membres.","Un bon leader prépare la relève : il forme d'autres membres et partage les tâches.","Le leadership des femmes se renforce en prenant la parole, en assumant des responsabilités et en se soutenant mutuellement."],
recit:"Dans un groupement, la présidente décidait tout seule. Les membres ont arrêté de venir. La nouvelle présidente demande l'avis de chacune avant chaque décision : la présence est remontée à 100 %.",
questions:["Quelles qualités avait la nouvelle présidente ?","Comment préparer d'autres femmes à devenir responsables ?","Quelle petite action de leadership puis-je faire ce mois-ci ?"],
retenir:"Le vrai leader sert le groupe, donne l'exemple et fait grandir les autres."},
{id:"oral",grp:"plus",icon:"🎤",titre:"L'art oratoire : bien prendre la parole",duree:"90 min",methode:"Exercices pratiques – jeux de rôle",
obj:["Prendre la parole en public avec assurance","Structurer un message court et clair","Savoir parler devant les autorités et les partenaires"],
etapes:["Exercice brise-glace : se présenter en 30 secondes","Les 3 parties d'une intervention : introduction, message, conclusion","Exercice : préparer un message de 1 minute sur le groupement","Conseils sur la voix, le regard et la posture","Simulation : présenter une demande au maire ou au chef de village","Retours bienveillants du groupe"],
cles:["Préparer : savoir à qui on parle, ce qu'on veut obtenir et 2 ou 3 idées principales.","Saluer selon les usages, se présenter et présenter le groupement.","Une idée = une phrase simple ; donner un exemple concret ou un chiffre.","Parler fort et lentement, regarder l'assistance, rester calme.","Terminer par une demande précise et remercier.","S'entraîner avant devant le groupe : c'est en pratiquant qu'on gagne confiance."],
recit:"Awa devait demander un terrain au conseil communal. La première fois, elle a parlé longtemps sans dire ce qu'elle voulait. La deuxième fois, elle a préparé 3 phrases : qui nous sommes, notre besoin, notre demande. La réponse a été positive.",
questions:["Qu'est-ce qui a changé entre les deux interventions ?","Comment présenter notre groupement en 1 minute ?","Quelle demande précise ferions-nous au maire ?"],
retenir:"Court, clair, préparé : qui nous sommes, ce dont nous avons besoin, ce que nous demandons."},
{id:"plaid",grp:"plus",icon:"📣",titre:"Le plaidoyer",duree:"2 séances de 90 min",methode:"Travail en petits groupes – simulation",
obj:["Comprendre ce qu'est le plaidoyer et à quoi il sert","Préparer un plan de plaidoyer simple","Mener une rencontre de plaidoyer avec les décideurs"],
etapes:["Lister les problèmes qui dépassent le groupement (accès à la terre, à l'eau, au marché, aux services…)","Choisir un problème prioritaire","Identifier la cible : qui peut décider ? (maire, chef de village, service technique)","Identifier les alliés et les opposants","Formuler le message et la demande","Simulation de rencontre, puis plan d'action (qui, quoi, quand)"],
cles:["Le plaidoyer est un ensemble d'actions pour convaincre ceux qui décident de changer une situation, une règle ou un budget.","Il s'appuie sur des faits : chiffres du groupement ou du réseau, témoignages.","Les 6 étapes : problème → objectif → cible → alliés → message → action et suivi.","Le réseau donne plus de poids au plaidoyer : il parle au nom de nombreux groupements.","Rester respectueux et constructif, proposer des solutions.","Suivre les engagements obtenus et rendre compte aux membres."],
recit:"Le réseau communal de 18 groupements a présenté au maire ses chiffres : 520 femmes, 4 millions F d'épargne, aucun espace pour le marché des femmes. Le conseil a réservé une place dans le nouveau marché.",
questions:["Pourquoi le maire a-t-il été convaincu ?","Quel problème prioritaire pourrions-nous porter ?","Qui sont nos alliés ?"],
retenir:"Des faits, une cible, une demande précise et un suivi : c'est la force d'un bon plaidoyer. Les chiffres de l'application servent de preuve."},
{id:"fin",grp:"plus",icon:"📒",titre:"La gestion financière",duree:"2 séances de 90 min",methode:"Exercices de calcul – études de cas",
obj:["Tenir correctement les comptes du groupement","Faire un budget simple pour le ménage et pour une AGR","Bien utiliser le crédit et éviter le surendettement"],
etapes:["Rappel : les 4 tasses et les cahiers de la caisse","Exercice : calculer la caisse (épargne + fonds social + remboursements + intérêts + amendes − prêts)","Le budget familial : entrées, dépenses obligatoires, épargne","Le prix de revient d'une AGR et le bénéfice","Étude de cas : prêt bien ou mal utilisé","Le partage de fin de cycle : comment le calculer"],
cles:["Toujours séparer l'argent du groupement, celui de l'AGR et celui du ménage.","Tout mouvement d'argent est compté, contrôlé et noté le jour même.","Budget : prévoir d'abord l'épargne, puis les dépenses ; noter ce qu'on gagne et ce qu'on dépense.","Bénéfice = prix de vente − (achats + transport + transformation + autres coûts).","Emprunter pour une activité qui rapporte plus que l'intérêt à payer ; ne pas emprunter pour rembourser une autre dette.","Au partage, chaque membre reçoit son épargne et une part des intérêts et amendes, selon ses parts."],
recit:"Fanta emprunte 20 000 F pour acheter des arachides à la récolte et les revend 3 mois plus tard. Elle gagne 9 000 F, rembourse 22 000 F et garde 7 000 F. Sali emprunte la même somme pour une fête et ne peut pas rembourser.",
questions:["Quelle différence entre les deux prêts ?","Comment calculer le bénéfice de Fanta ?","Comment faire un petit budget familial ?"],
retenir:"Compter, noter, contrôler ; emprunter pour produire et rembourser à temps."},
{id:"gouv",grp:"plus",icon:"🔍",titre:"Transparence et redevabilité",duree:"90 min",methode:"Discussion – exercice pratique",
obj:["Comprendre la bonne gouvernance dans un groupement ou un réseau","Savoir rendre compte aux membres","Prévenir les détournements et les conflits"],
etapes:["Qu'est-ce qu'un groupement bien géré ?","Les 5 principes de bonne gouvernance","Exercice : préparer un compte rendu financier mensuel à l'AG","Les outils : cahiers, PV, rapport de l'application","Le renouvellement du comité à la fin du mandat"],
cles:["Participation : chaque membre peut s'exprimer et voter.","Transparence : les chiffres de la caisse sont annoncés à chaque réunion.","Redevabilité : le comité rend compte de ses décisions et de l'argent.","Respect des règles : le RI s'applique à toutes, y compris aux responsables.","Alternance : le comité est renouvelé à la fin de son mandat.","Les PV signés et les rapports partagés sont des preuves de bonne gestion."],
recit:"Un trésorier de réseau gardait les cotisations sans rien présenter. Après 6 mois, les groupements ont refusé de cotiser. Le nouveau bureau présente les comptes à chaque assemblée : les cotisations sont revenues.",
questions:["Pourquoi les groupements ont-ils arrêté de cotiser ?","Comment rendre compte dans notre groupement ?","Quand notre comité doit-il être renouvelé ?"],
retenir:"La confiance vient de la transparence : montrer les chiffres, rendre compte, respecter les mandats."},
{id:"reseau",grp:"plus",icon:"🌐",titre:"Créer et animer un réseau VSLA",duree:"2 séances de 90 min",methode:"Discussion – travail en groupe – planification",
obj:["Comprendre l'intérêt de se regrouper en réseau","Connaître l'organisation par niveau : village, commune, cercle, région","Élaborer le plan d'action du réseau"],
etapes:["Pourquoi un réseau ? (force du nombre, échanges, plaidoyer, marché)","Les niveaux : groupements → réseau villageois → communal → de cercle → régional","Les organes : AG du réseau, bureau, commissions","Les ressources : cotisation d'adhésion, cotisations annuelles, AGR collectives","Élaborer un plan d'action annuel","Suivi : rapports, réunions périodiques, chiffres consolidés"],
cles:["Village : les groupements → commune : les réseaux villageois → cercle : les réseaux communaux → région : les réseaux de cercle.","Chaque niveau envoie ses délégués au niveau supérieur et rend compte au niveau inférieur.","Rythme des réunions : réseau villageois chaque mois, communal chaque trimestre, de cercle chaque semestre, régional une fois par an.","Chaque groupement et chaque réseau a un bureau d'au moins 5 membres, avec prénom, nom et téléphone de chacun.","Le réseau ne gère pas l'épargne des groupements : chaque caisse reste autonome.","Le réseau sert à : partager l'expérience, appuyer les groupements en difficulté, faire du plaidoyer, organiser l'achat et la vente groupés.","Le réseau a son propre règlement, son bureau élu et une caisse alimentée par les cotisations des membres.","Le secrétaire du réseau suit dans l'application la composition et la caisse du réseau, et tient les PV."],
recit:"Les 6 groupements de Kola ont créé un réseau villageois. Ensemble, ils ont acheté du savon en gros et négocié un prix plus bas, puis organisé une journée d'échanges avec un village voisin.",
questions:["Qu'est-ce que notre réseau peut faire qu'un groupement seul ne peut pas faire ?","Qui seront nos délégués au niveau supérieur ?","Quelles 3 activités pour notre plan d'action ?"],
retenir:"Un réseau fort repose sur des groupements forts, des délégués qui rendent compte et un plan d'action partagé."},
{id:"agr",grp:"plus",icon:"🧺",titre:"AGR et commercialisation",duree:"2 séances de 90 min",methode:"Études de cas – calculs – visite de marché",
obj:["Choisir une AGR rentable","Calculer le prix de revient et fixer le prix de vente","Améliorer la qualité et vendre ensemble"],
etapes:["Lister les AGR possibles selon les ressources locales et la saison","Critères de choix : demande, savoir-faire, capital, risque","Exercice : prix de revient et prix de vente","Qualité, emballage, présentation du produit","La vente groupée et le Marché des AGR de l'application","Plan d'affaires simple d'une page"],
cles:["Prix de revient = matières premières + transport + transformation + emballage + autres frais.","Prix de vente = prix de revient + marge (en tenant compte du prix du marché).","Acheter quand c'est moins cher (récolte), stocker dans de bonnes conditions, vendre en période de soudure.","Un produit propre, bien emballé et étiqueté se vend mieux et plus cher.","Vendre ensemble permet de gagner des clients plus importants et de négocier les prix.","Publier son produit dans le Marché des AGR permet d'être contacté par d'autres groupements."],
recit:"Un groupement vendait son beurre de karité en vrac au marché du village. Après une formation, il l'a conditionné en pots propres avec une étiquette, et le vend à des groupements d'autres communes grâce au Marché des AGR.",
questions:["Quelle AGR est rentable dans notre village ?","Quel est le prix de revient de notre produit ?","Comment l'améliorer pour mieux le vendre ?"],
retenir:"Connaître ses coûts, soigner la qualité et vendre ensemble. Le catalogue de l'application aide à fixer les prix."},
{id:"plan",grp:"plus",icon:"🗓️",titre:"Planification et suivi des activités",duree:"90 min",methode:"Travail en groupe – tableau",
obj:["Élaborer un plan d'action simple","Suivre la réalisation des activités","Faire le point régulièrement en AG"],
etapes:["Rappel de l'objectif du groupement ou du réseau","Lister les activités nécessaires","Remplir le tableau : quoi ? qui ? quand ? avec quels moyens ?","Fixer des indicateurs simples (nombre, montant, date)","Prévoir un point de suivi à chaque réunion mensuelle","Noter les décisions dans les PV"],
cles:["Un plan d'action répond à : quoi, qui, quand, où, avec quels moyens, combien.","Chaque activité a un responsable.","Un indicateur permet de savoir si on avance : nombre de membres, épargne totale, nombre de produits vendus…","Faire le point régulièrement permet de corriger avant qu'il soit trop tard.","Les PV gardent la mémoire des décisions."],
recit:"Le réseau voulait organiser une foire des produits locaux. Sans plan, rien n'a été fait. L'année suivante, il a fixé une date, nommé une responsable par tâche et fait le point chaque mois : la foire a eu lieu.",
questions:["Quel est notre objectif pour cette année ?","Quelles activités, qui et quand ?","Comment saurons-nous que nous avons réussi ?"],
retenir:"Un objectif sans plan reste un rêve : écrire le plan, nommer les responsables, suivre chaque mois."},
{id:"ssr",grp:"sante",icon:"🌸",titre:"La santé sexuelle et reproductive : les bases",duree:"90 min",methode:"Causerie en petits groupes (femmes / hommes / jeunes) – images – questions anonymes",
obj:["Connaître le corps et les étapes de la vie reproductive (puberté, grossesse, ménopause)","Connaître ses droits en santé sexuelle et reproductive","Savoir quand et où aller au centre de santé (CSCom)"],
etapes:["Avant la séance : inviter l'agent(e) de santé ou la matrone du CSCom à co-animer","Règles de la causerie : respect, pas de moquerie, ce qui est dit reste dans le groupe","Jeu : la boîte à questions anonymes (chacun dépose sa question sur un papier ou la dit à l'animatrice en privé)","Avec des images : les changements du corps à la puberté chez la fille et le garçon","Les signes de danger pendant la grossesse et l'importance des consultations prénatales","Les infections sexuellement transmissibles (IST) et le VIH : comment se protéger, se faire dépister et se soigner","Réponses aux questions de la boîte, puis engagements"],
cles:["La santé sexuelle et reproductive, c'est être en bonne santé dans son corps et dans sa vie de couple, et pouvoir décider librement, sans contrainte ni violence.","Chacun a droit à l'information, aux soins, à la confidentialité, et au choix du nombre d'enfants et du moment de les avoir.","Pendant la grossesse : au moins 4 consultations prénatales (8 contacts recommandés par l'OMS) et l'accouchement au centre de santé.","Signes de danger qui demandent d'aller tout de suite au centre : saignement, fortes maux de tête, convulsions, forte fièvre, pertes d'eau, enfant qui ne bouge plus.","Les IST (écoulements, plaies, démangeaisons) se soignent : il faut consulter tôt, avec son ou sa partenaire, et ne pas se soigner seul(e).","Le préservatif protège à la fois des IST, du VIH et des grossesses non désirées.","Les adolescentes et les adolescents ont besoin d'informations justes adaptées à leur âge : les parents et les responsables doivent pouvoir en parler sans honte."],
recit:"Aminata, enceinte de 6 mois, a de fortes douleurs à la tête et les pieds gonflés. Sa belle-mère dit d'attendre. Sa voisine, membre du groupement, se souvient de la causerie : elles prennent l'argent du fonds social pour le transport et vont au CSCom. L'infirmier dit qu'il était temps : Aminata est soignée et accouche ensuite sans problème.",
questions:["Quels signes de danger Aminata avait-elle ?","Comment le groupement a-t-il aidé ? Notre fonds social peut-il servir pour ce genre d'urgence ?","Qui, dans notre village, peut donner une information juste sur la santé reproductive ?"],
retenir:"S'informer, consulter tôt et décider librement : c'est le droit de chaque femme, de chaque homme et de chaque jeune.",
note:"Thème sensible : faites-le co-animer par un agent de santé, séparez les groupes si nécessaire et respectez la confidentialité. Ne donnez jamais de conseil médical à la place du centre de santé."},
{id:"hm",grp:"sante",icon:"🩸",titre:"L'hygiène menstruelle",duree:"90 min",methode:"Causerie – démonstration – fabrication de serviettes lavables",
obj:["Comprendre les règles comme un phénomène naturel et sain","Connaître les bonnes pratiques d'hygiène pendant les règles","Lutter contre la honte et les interdits qui font manquer l'école ou les activités"],
etapes:["Mise en confiance : causerie entre femmes et filles (une séance séparée peut être faite avec les hommes et les garçons)","Avec une image du corps : comment fonctionne le cycle menstruel","Lister les croyances du village sur les règles et discuter : vrai ou faux ?","Démonstration : les protections (serviettes jetables, serviettes en tissu lavables) et comment les entretenir","Atelier pratique : coudre une serviette lavable ou présenter un kit (savon, sachet, serviettes, culotte)","Discussion : comment rendre les latrines de l'école et du village adaptées aux filles ?","Idée d'AGR : fabrication et vente de serviettes lavables par le groupement"],
cles:["Les règles sont normales : elles montrent que le corps de la fille est en bonne santé. Elles commencent souvent entre 10 et 16 ans.","Le cycle dure en général de 21 à 35 jours et les saignements de 2 à 7 jours ; il peut être irrégulier au début.","Changer de protection au moins 3 à 4 fois par jour, se laver chaque jour à l'eau propre et au savon, se laver les mains avant et après.","Les serviettes en tissu se lavent à l'eau froide et au savon, puis sèchent au soleil (le soleil tue les microbes) ; ne pas les cacher humides dans un coin sombre.","Les douleurs légères sont normales ; des douleurs très fortes, des saignements très abondants ou qui durent plus de 7 jours demandent d'aller au centre de santé.","Une fille qui a ses règles peut aller à l'école, travailler, se laver et manger de tout.","Les hommes et les garçons ont un rôle : ne pas se moquer, soutenir l'achat des protections et l'aménagement de latrines avec de l'eau et une porte qui ferme."],
recit:"Kadiatou, 13 ans, ne va plus à l'école quand elle a ses règles, par peur de tacher son habit et des moqueries. Le groupement de sa mère apprend à coudre des serviettes lavables et en vend au marché. Le comité de gestion de l'école installe un seau d'eau et une porte aux latrines. Kadiatou ne manque plus un seul jour de classe.",
questions:["Pourquoi Kadiatou manquait-elle l'école ?","Qu'ont fait le groupement et l'école ? Que pouvons-nous faire chez nous ?","Quelles croyances sur les règles faut-il changer dans notre village ?"],
retenir:"Les règles ne sont ni une maladie ni une honte : avec de l'eau, du savon, une protection propre et du respect, chaque fille continue à vivre normalement.",
note:"Utilisez des mots simples et respectueux en langue locale. Les questions intimes peuvent être posées en privé."},
{id:"pf",grp:"sante",icon:"👪",titre:"La planification familiale",duree:"90 min",methode:"Causerie avec l'agent de santé – témoignages – jeu « vrai ou faux »",
obj:["Comprendre les avantages de l'espacement des naissances pour la mère, l'enfant et la famille","Connaître les méthodes modernes disponibles au centre de santé","Encourager le dialogue dans le couple et le libre choix"],
etapes:["Inviter l'agent(e) de santé ou la sage-femme du CSCom","Jeu : deux familles dessinées, l'une avec des naissances rapprochées, l'autre espacées : quelles différences ?","Les avantages de l'espacement pour la santé et l'économie du ménage","Présentation des méthodes par l'agent de santé (avec le présentoir du CSCom)","Jeu « vrai ou faux » sur les rumeurs","Discussion : comment parler de PF dans le couple ?","Où et quand aller au CSCom ; engagement à transmettre l'information"],

function buildPayload(gr){
  if(isNet(gr))return buildNetPayload(gr);
  var s=stats(gr),dates={};gr.cotisations.forEach(function(c){dates[c.date]=1});var dl=Object.keys(dates).sort();
  var cc=catCounts(gr);gr.projet=(projet&&projet.code)||gr.projet||"";
  return {key:SYNC_KEY,action:"upsert",projet:gr.projet,from:{nom:profile.nom||"",tel:profile.tel||"",structure:profile.structure||""},
    summary:{membres:active(gr).length,epargne:Math.round(s.ep),social:Math.round(s.so),encours:Math.round(s.enc),retards:s.late.length,caisse:Math.round(s.caisse),reunions:dl.length,derniere:dl.length?fdate(dl[dl.length-1]):"",femmes:cc.F,hommes:cc.H,filles:cc.Fi,garcons:cc.G,amendesP:Math.round(s.amP),amendesNP:Math.round(s.amNP),nbAgr:(gr.agr||[]).length},
    bureau:bureauPayload(gr),
    agr:(gr.agr||[]).map(function(a){return {membre:mName(gr,a.membreId),activite:a.activite,produit:a.produit,unite:a.unite,prix:a.prix,quantite:a.quantite,description:a.description,publier:!!a.publier,contact:a.publier?a.contact:""}}),
    membres:gr.membres.map(function(m){var ms=memberStats(gr,m);return {nom:m.nom,tel:m.tel||"",parts:m.parts||1,statut:m.sorti?t("memberOut"):"Actif",epargne:Math.round(ms.ep),doit:Math.round(ms.reste),categorie:t("cat_"+catOf(m))}}),
    group:gr};
}
function flush(){
  var u=serverUrl();if(!u||flushing)return;if(navigator.onLine===false)return;
  var ids=Object.keys(pending);if(!ids.length)return;
  var id=ids[0],job=pending[id],body;
  if(!projet||!projet.code||projet.bloque)return;
  if(job.a==="del")body={key:SYNC_KEY,action:"delete",id:id,projet:projet.code};
  else if(groups[id])body=buildPayload(groups[id]);
  else{delete pending[id];savePending();return flush()}
  flushing=true;
  fetch(u,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(){
    if(pending[id]&&pending[id].v===job.v)delete pending[id];
    savePending();try{localStorage.setItem("caisse_avec_demo_lastsync",new Date().toISOString())}catch(e){}
    flushing=false;updateSync();flush();
  },function(){flushing=false;updateSync()});
}
function updateSync(){
  var el=document.getElementById("sync");if(!el)return;
  if(!serverUrl()){el.textContent="";return}
  var n=Object.keys(pending).length;el.textContent=(projet&&projet.nom?t("projectLbl",{n:projet.nom})+" · ":"")+(n?t("syncPending",{n:n}):t("syncOk"));
}
function pullServer(silent,pwd,cb){
  var u=serverUrl();if(!u){if(!silent)toast(t("noServer"));if(cb)cb(false);return}
  pwd=pwd||adminPwd;
  fetch(u+(u.indexOf("?")<0?"?":"&")+"key="+encodeURIComponent(SYNC_KEY)+"&pwd="+encodeURIComponent(pwd)+"&t="+Date.now()).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok){if(d&&d.err==="mdp"){toast(t("wrongPwd"));if(cb)cb(false,"mdp");return}throw 0}
    globalDb={};var n=0;globalRole=d.role||"";globalProjets=d.projets||{};
    (d.groups||[]).forEach(function(x){if(x&&x.id){var fr=(d.from&&d.from[x.id])||{};globalDb[x.id]={g:normalize(x),from:fr,recu:fr.maj?String(fr.maj).slice(0,10):""};n++}});
    if(cb)cb(true);
    if(view==="global")render();if(!silent)toast(t("refreshed",{n:n}));
  }).catch(function(){toast(t("syncFail"));if(cb)cb(false)});
}
function serverDelete(ids,cb){
  var u=serverUrl();if(!u){toast(t("noServer"));cb(false);return}
  fetch(u+(u.indexOf("?")<0?"?":"&")+"key="+encodeURIComponent(SYNC_KEY)+"&pwd="+encodeURIComponent(adminPwd)+"&action=del&ids="+encodeURIComponent(ids.join(","))+"&t="+Date.now()).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok){toast(t(d&&d.err==="mdp"?"wrongPwd":"syncFail"));cb(false);return}cb(true,d)}).catch(function(){toast(t("syncFail"));cb(false)});
}

function mergeLangs(){
  if(!FR_BASE)FR_BASE=Object.keys(I18N.fr);
  Object.keys(I18N).forEach(function(k){if(!BASE_LANGS[k])delete I18N[k]});
  LANGNAMES={};Object.keys(BASE_LANGS).forEach(function(k){LANGNAMES[k]=BASE_LANGS[k]});
  [langSrv,langX].forEach(function(st){Object.keys(st).forEach(function(c){var x=st[c];if(!x||BASE_LANGS[c])return;I18N[c]=Object.assign(I18N[c]||{},x.dict||{});LANGNAMES[c]=x.nom||LANGNAMES[c]||c})});
}
function langKeys(){return FR_BASE.filter(function(k){var v=I18N.fr[k];return typeof v==="string"||Array.isArray(v)})}
function langProgress(c){var ks=langKeys(),d=I18N[c]||{},n=0;ks.forEach(function(k){if(d[k]!=null&&String(d[k]).trim()!=="")n++});return n?Math.max(1,Math.floor(100*n/ks.length)):0}
function buildLangSel(){

function place(gr){return [gr.village,gr.commune,gr.cercle,gr.region,gr.pays].filter(function(x){return x}).join(", ")}
function active(gr){return gr.membres.filter(function(m){return !m.sorti})}

function setStatus(k){statusKey=k;$("status").textContent=t(k)}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({groups:groups,currentId:currentId}))}catch(e){}}
function loadLocal(){try{var s=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(s&&s.groups){groups=s.groups;currentId=s.currentId;Object.keys(groups).forEach(function(k){normalize(groups[k])})}}catch(e){}}
function markParents(id,d){if(d>4)return;Object.keys(groups).forEach(function(k){var x=groups[k];if(isNet(x)&&x.composantes.some(function(c){return c.refId===id})){x.composantes.forEach(function(c){if(c.refId&&groups[c.refId]){var f2=compFig(x,c);c.snap={nbGr:f2.nbGr,F:f2.F,H:f2.H,Fi:f2.Fi,G:f2.G,m:f2.m,ep:f2.ep}}});markPending(k,"up");markParents(k,d+1)}})}
function persist(gr){
  if(isNet(gr))gr.composantes.forEach(function(c){if(c.refId&&groups[c.refId]){var f2=compFig(gr,c);c.snap={nbGr:f2.nbGr,F:f2.F,H:f2.H,Fi:f2.Fi,G:f2.G,m:f2.m,ep:f2.ep}}});
  markPending(gr.id,"up");markParents(gr.id,0);
  if(mode==="cloud"&&col){
    var id=gr.id,body=JSON.parse(JSON.stringify(gr));lastJson[id]=JSON.stringify(body);
    var prev=writeChains[id]||Promise.resolve();
    writeChains[id]=prev.then(function(){return col.doc(id).set(body)}).then(function(){setStatus("saved")},function(e){setStatus("saveFail");if(e&&e.code==="quota_exceeded")toast(t("full"))});
  }
  saveLocal();
}
function removeGroup(id){
  delete groups[id];markPending(id,"del");
  if(mode==="cloud"&&col){var prev=writeChains[id]||Promise.resolve();writeChains[id]=prev.then(function(){return col.doc(id).delete()}).catch(function(){})}
  saveLocal();
}
function fallback(){mode="local";setStatus("offline")}
function startCloud(){
  if(!window.claude||typeof window.claude.use!=="function"){fallback();return}
  setStatus("connecting");
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user){fallback();return}
    return user.id().then(function(id){
      if(!id){fallback();return}
      col=db.collection("data/users/"+id);
      var timer=setTimeout(function(){setStatus("slow")},10000),first=true;
      col.onSnapshot(function(snap){
        if(!snap.metadata.fromCache)clearTimeout(timer);
        var remote={};
        snap.docs.forEach(function(d){if(d.exists){var b=d.data();if(b&&b.id)remote[b.id]=normalize(JSON.parse(JSON.stringify(b)))}});
        if(first){first=false;mode="cloud";Object.keys(groups).forEach(function(k){if(!remote[k]){remote[k]=groups[k];persist(groups[k])}})}
        var changed=false;
        Object.keys(remote).forEach(function(k){var j=JSON.stringify(remote[k]);if(lastJson[k]!==j){lastJson[k]=j;groups[k]=remote[k];changed=true}});
        if(!snap.metadata.fromCache){Object.keys(groups).forEach(function(k){if(!remote[k]&&!writeChains[k]){delete groups[k];changed=true}});setStatus("synced")}
        saveLocal();if(changed)render();
      },function(){clearTimeout(timer);mode="local";setStatus("offline")});
    });
  }).catch(fallback);
}

/* ---------- calculs ---------- */
function loanInfo(gr,p){
  var du=p.montant*(1+(p.taux/100)*p.duree);
  var paye=sum(gr.remboursements.filter(function(r){return r.pretId===p.id}),function(r){return r.montant});
  var reste=Math.max(0,du-paye),ech=addMonths(p.date,p.duree);
  return {du:du,paye:paye,reste:reste,ech:ech,st:reste<=0.5?"ok":(ech<today()?"late":"run")};
}
function stats(gr){
  var aid=sum(gr.aides||[],function(a){return a.montant});
  var ep=sum(gr.cotisations,function(c){return c.epargne}),so=sum(gr.cotisations,function(c){return c.social})+num(gr.socialReport)-aid;
  var pr=sum(gr.prets,function(p){return p.montant}),rb=sum(gr.remboursements,function(r){return r.montant});
  var enc=0,late=[],interets=0;
  gr.prets.forEach(function(p){var i=loanInfo(gr,p);enc+=i.reste;interets+=i.du-p.montant;if(i.st==="late")late.push({p:p,i:i})});
  var am=gr.amendes||[],amP=sum(am.filter(function(a){return a.paye}),function(a){return a.montant}),amNP=sum(am.filter(function(a){return !a.paye}),function(a){return a.montant});
  return {ep:ep,so:so,caisse:ep+so+rb-pr+amP,enc:enc,late:late,interets:interets,amP:amP,amNP:amNP,aid:aid};
}
function memberStats(gr,m){
  var ep=sum(gr.cotisations.filter(function(c){return c.membreId===m.id}),function(c){return c.epargne}),reste=0;
  gr.prets.filter(function(p){return p.membreId===m.id}).forEach(function(p){reste+=loanInfo(gr,p).reste});
  return {ep:ep,reste:reste};
}

  act.forEach(function(m){var ms=memberStats(gr,m),dues=sum((gr.amendes||[]).filter(function(a){return a.membreId===m.id&&!a.paye}),function(a){return a.montant});rows.push({m:m,ep:ms.ep,pret:ms.reste,am:dues});epTot+=ms.ep});

  return {rows:rows,epTot:epTot,cashOut:cashOut,valeur:valeur,profit:profit,rend:epTot>0?100*profit/epTot:0,reste:Math.max(0,cashOut-given),manque:manque,s:s};
